<script src="content.js?v=20260921-20"></script>
<script>
(function(){
  "use strict";

  /* Flipped to true only for the standalone preview build, which has no
     licence server behind it. The deployed build must stay false. */
  var PREVIEW = false;
  var API = "";

  function $(id){ return document.getElementById(id); }
  function el(tag, attrs){
    var e = document.createElement(tag), k, i;
    if(attrs) for(k in attrs){
      if(k === "text") e.textContent = attrs[k];
      else if(k === "html") e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    for(i = 2; i < arguments.length; i++){
      var c = arguments[i];
      if(c == null) continue;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return e;
  }
  /* Fun Game's mark: a five-point star, the same shape as the reward the
     whole app runs on, so the logo and the currency read as one idea.
     Used wherever the brand name is introduced, not on every gated card. */
  function svgLogo(size){
    var d = "M12 2 14.4 8.8 21.5 8.9 15.8 13.2 17.9 20.1 12 16 6.1 20.1 8.2 13.2 2.5 8.9 9.6 8.8 Z";
    return el("div",{html:
      '<svg width="' + (size || 26) + '" height="' + (size || 26) + '" viewBox="0 0 24 24" ' +
      'fill="none" aria-hidden="true"><path d="' + d + '" fill="#fff"/></svg>'});
  }
  function ri(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function titleCase(x){ return String(x||"").charAt(0).toUpperCase() + String(x||"").slice(1); }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  /* ---------- sound: short blips, generated on the fly ---------- */
  var actx = null;
  /* The listening games are asking the child to hear a difference, so their
     notes are played louder than the tap and tick sounds around them. */
  var MUSIC_GAME_VOL = 0.34;
  function beep(freq, dur, type, vol){
    if(state && state.sound === false) return;
    try{
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === "suspended") actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(vol || .16, actx.currentTime + .01);
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    }catch(e){ /* sound is a bonus, never a requirement */ }
  }
  /* A richer kit than four blips. Everything is still generated on the fly —
     no audio files to download, which matters on a school wifi — but a rising
     arpeggio for a right answer and a real fanfare at the end of a round make
     the app feel alive in a way a single tone never did. */
  function tone(freq, dur, opts){
    if(state && state.sound === false) return;
    opts = opts || {};
    try{
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === "suspended") actx.resume();
      var t0 = actx.currentTime + (opts.at || 0);
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = opts.type || "sine";
      o.frequency.setValueAtTime(freq, t0);
      /* A glide makes a swoop or a slide-whistle out of the same oscillator. */
      if(opts.to) o.frequency.exponentialRampToValueAtTime(opts.to, t0 + dur);
      var vol = opts.vol == null ? .16 : opts.vol;
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + dur + .02);
    }catch(e){ /* sound is a bonus, never a requirement */ }
  }
  /* Short burst of filtered noise — a shaker, a drum, a pop. */
  function noise(dur, opts){
    if(state && state.sound === false) return;
    opts = opts || {};
    try{
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === "suspended") actx.resume();
      var t0 = actx.currentTime + (opts.at || 0);
      var n = Math.floor(actx.sampleRate * dur);
      var buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0), i;
      for(i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      var src = actx.createBufferSource(); src.buffer = buf;
      var f = actx.createBiquadFilter();
      f.type = opts.filter || "bandpass";
      f.frequency.value = opts.freq || 1400;
      var g = actx.createGain(); g.gain.value = opts.vol == null ? .18 : opts.vol;
      src.connect(f); f.connect(g); g.connect(actx.destination);
      src.start(t0);
    }catch(e){}
  }
  function chord(freqs, dur, opts){
    freqs.forEach(function(f){ tone(f, dur, opts); });
  }

  var sfx = {
    good: function(){ [660, 880, 1175].forEach(function(f,i){ tone(f, .16, {at:i*.07, vol:.15}); }); },
    bad:  function(){ tone(200, .26, {type:"triangle", to:120, vol:.16}); },
    win:  function(){
      [523,659,784,1046].forEach(function(f,i){ tone(f, .22, {at:i*.1, vol:.17}); });
      chord([523,659,784,1046], .9, {at:.45, vol:.09});
      [0,.12,.24,.36].forEach(function(a){ noise(.16, {at:.45+a, freq:5200, vol:.07}); });
    },
    tap:  function(){ tone(520, .05, {vol:.1}); },
    pop:  function(){ tone(900, .07, {to:1500, vol:.13}); noise(.05, {freq:2600, vol:.08}); },
    swoosh: function(){ noise(.22, {filter:"highpass", freq:900, vol:.1}); },
    levelup: function(){
      [392,523,659,784,1046].forEach(function(f,i){ tone(f, .2, {at:i*.08, vol:.16}); });
      chord([784,1046,1319], 1.0, {at:.4, vol:.08});
    },
    /* A short drum roll, for the moment before a result is shown. */
    roll: function(){
      var i; for(i = 0; i < 12; i++) noise(.05, {at:i*.045, freq:320, filter:"lowpass", vol:.09});
    },
    streak: function(n){
      var base = 523, i;
      for(i = 0; i < Math.min(n, 5); i++) tone(base * Math.pow(1.122, i * 2), .13, {at:i*.06, vol:.14});
    }
  };

  /* ---------- background music ----------
   *
   * Written by the app rather than played from a file: a handful of moods,
   * each a scale, a chord progression and a tempo, arpeggiated softly under
   * the game. Nothing to download, it works offline, and it never repeats
   * exactly — which matters when a child plays the same game for an hour.
   *
   * It sits well below the sound effects and the spoken words on purpose. If
   * you notice it, it is too loud.
   *
   * Notes are scheduled ahead on a timer rather than per animation frame, so
   * a busy game like Harbour Cannon cannot make the music stutter.
   */
  var MOODS = {
    /* root is a frequency; scale and chords are semitone offsets. */
    calm:    {root:196.00, scale:[0,2,4,7,9],      chords:[[0,4,7],[5,9,12],[3,7,10],[7,11,14]], bpm:62, wave:"sine",     pad:0.030, lead:0.045},
    bright:  {root:261.63, scale:[0,2,4,6,7,9,11], chords:[[0,4,7],[7,11,14],[5,9,12],[2,5,9]],  bpm:76, wave:"triangle", pad:0.026, lead:0.042},
    /* The classic Chinese pentatonic (gong mode: do-re-mi-sol-la, no fa or
       ti) is what actually reads as "Chinese" to most ears — Mo Li Hua and
       most folk melodies are built on it. leadDur is much shorter than the
       other moods' so the same oscillator envelope plucks rather than
       sustains, closer to a guzheng than a held pad. */
    eastern: {root:220.00, scale:[0,2,4,7,9],      chords:[[0,4,7],[2,7,11],[0,4,9],[5,9,14]],   bpm:58, wave:"triangle",  pad:0.030, lead:0.052, leadDur:0.55},
    curious: {root:233.08, scale:[0,2,5,7,10],     chords:[[0,5,10],[3,7,12],[5,10,15],[0,7,12]],bpm:68, wave:"triangle", pad:0.028, lead:0.040},
    mystery: {root:174.61, scale:[0,3,5,7,10],     chords:[[0,3,7],[5,8,12],[3,7,10],[7,10,14]], bpm:54, wave:"sine",     pad:0.034, lead:0.038},
    sea:     {root:196.00, scale:[0,2,4,7,9,11],   chords:[[0,4,7],[2,7,11],[5,9,12],[4,7,11]],  bpm:70, wave:"sine",     pad:0.030, lead:0.044},
    bouncy:  {root:293.66, scale:[0,2,4,7,9],      chords:[[0,4,7],[5,9,12],[7,11,14],[0,4,9]],  bpm:92, wave:"triangle", pad:0.022, lead:0.040},
    heroic:  {root:174.61, scale:[0,2,3,5,7,8,10],  chords:[[0,3,7],[5,8,12],[7,10,14],[3,7,10]], bpm:84, wave:"triangle", pad:0.030, lead:0.046},
    sunny:   {root:246.94, scale:[0,2,4,7,9,11],   chords:[[0,4,7],[7,11,14],[2,5,9],[5,9,12]],  bpm:80, wave:"sine",     pad:0.026, lead:0.042}
  };

  /* Which mood a subject gets. Related games share one so moving between
     them does not feel like changing radio station. */
  var SUBJECT_MOOD = {
    maths:"calm", english:"bright", chinese:"eastern", think:"curious",
    science:"sunny", inspect:"mystery", music:"bright", guess:"curious",
    quick:"bouncy", duo:"bouncy"
  };
  /* A few games are distinctive enough to deserve their own. */
  var GAME_MOOD = { quest:"heroic", race:"bouncy", cannon:"sea", homes:"sunny", lifecycle:"sunny", foodchain:"sunny",
    detective:"mystery", shadow:"mystery", mystery:"mystery", riddle:"curious",
    duomaths:"bouncy", duoword:"bouncy", reading:"calm" };

  var music = (function(){
    var master = null, timer = null, mood = null;
    var step = 0, nextTime = 0, playing = false;
    var LOOKAHEAD = 0.35, TICK = 90;

    function ctx(){
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      return actx;
    }
    function freq(root, semi){ return root * Math.pow(2, semi / 12); }

    function voice(f, at, dur, wave, vol){
      var c = ctx();
      var o = c.createOscillator(), g = c.createGain();
      o.type = wave; o.frequency.setValueAtTime(f, at);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(vol, at + 0.06);
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      o.connect(g); g.connect(master);
      o.start(at); o.stop(at + dur + 0.05);
    }

    function schedule(){
      if(!playing || !mood) return;
      var c = ctx();
      var beat = 60 / mood.bpm;
      while(nextTime < c.currentTime + LOOKAHEAD){
        var bar = Math.floor(step / 8) % mood.chords.length;
        var chord = mood.chords[bar];
        var inBar = step % 8;

        /* A soft pad on the first beat of each bar, long and very quiet. */
        if(inBar === 0){
          chord.forEach(function(semi, i){
            voice(freq(mood.root, semi - 12), nextTime, beat * 7.5,
              "sine", mood.pad * (i === 0 ? 1 : 0.7));
          });
        }
        /* An arpeggio that wanders rather than repeats: mostly chord tones,
           sometimes a passing note from the scale, and some beats left silent
           so it breathes. */
        if(Math.random() > 0.22){
          var semi;
          if(Math.random() < 0.72) semi = chord[Math.floor(Math.random() * chord.length)];
          else semi = mood.scale[Math.floor(Math.random() * mood.scale.length)];
          if(Math.random() < 0.3) semi += 12;
          voice(freq(mood.root, semi), nextTime, beat * (mood.leadDur || 1.7), mood.wave, mood.lead);
        }
        nextTime += beat;
        step++;
      }
    }

    return {
      start: function(key){
        if(state && (state.sound === false || state.music === false)) return;
        if(!MOODS[key]) key = "calm";
        if(playing && mood === MOODS[key]) return;
        this.stop();
        try{
          var c = ctx();
          if(c.state === "suspended") c.resume();
          master = c.createGain();
          master.gain.setValueAtTime(0.0001, c.currentTime);
          /* Fade in over a couple of seconds so it arrives rather than starts. */
          master.gain.exponentialRampToValueAtTime(1, c.currentTime + 2.2);
          master.connect(c.destination);
          mood = MOODS[key];
          step = 0;
          nextTime = c.currentTime + 0.12;
          playing = true;
          /* Visible in the DOM so what is playing can be checked without
             guessing from oscillator counts. */
          try{ document.body.setAttribute("data-music", key); }catch(e){}
          schedule();
          timer = setInterval(schedule, TICK);
        }catch(e){ playing = false; }
      },
      stop: function(){
        playing = false; mood = null;
        try{ document.body.removeAttribute("data-music"); }catch(e){}
        if(timer){ clearInterval(timer); timer = null; }
        if(master){
          try{
            var c = ctx(), m = master;
            m.gain.cancelScheduledValues(c.currentTime);
            m.gain.setValueAtTime(Math.max(0.0001, m.gain.value), c.currentTime);
            m.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.5);
            setTimeout(function(){ try{ m.disconnect(); }catch(e){} }, 700);
          }catch(e){}
          master = null;
        }
      },
      playing: function(){ return playing; }
    };
  })();

  function moodFor(world){
    if(!world) return "calm";
    return GAME_MOOD[world.id] || SUBJECT_MOOD[world.cat] || "calm";
  }

  /* ---------- speech ----------
     Everything else in here is an oscillator blip, which is fine for "right"
     and "wrong" but cannot say a letter. "Match the sound to a picture" was a
     promise the game did not keep, so the phonics, rhyme, spelling and Chinese
     games now speak, using the voice already on the device. Nothing to
     download, and it works in Chinese as well as English.

     iOS will not speak until the page has had a tap, which entering a game
     always is, and it ignores a second utterance while one is in flight —
     hence the cancel before each. */
  var CAN_SPEAK = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
  var voices = [];
  function refreshVoices(){
    try{ voices = window.speechSynthesis.getVoices() || []; }catch(e){ voices = []; }
  }
  if(CAN_SPEAK){
    refreshVoices();
    /* Safari fills the list asynchronously, and on a cold load it is empty. */
    try{ window.speechSynthesis.onvoiceschanged = refreshVoices; }catch(e){}
  }
  /* Most engines mark a voice's sex only in its name, not a field we can
     read, so this is a name-matching heuristic rather than a real property.
     It is wrong for a voice named after nobody in either list, but right far
     more often than picking whichever voice happened to load first, which
     on Android and Windows is frequently male. */
  var FEMALE_VOICE_HINTS = /female|woman|girl|zira|susan|samantha|karen|serena|moira|tessa|fiona|kate|amy|emma|joanna|salli|ivy|kendra|jenny|aria|libby|olivia|sonia|natasha|yuna|xiaoxiao|xiaoyi|mei[-\s]?jia/i;
  var MALE_VOICE_HINTS = /\bmale\b|\bman\b|\bboy\b|daniel|david|mark|james|george|oliver|ryan|guy|brian|matthew|justin|kevin|eric/i;
  /* The flat, clipped read a parent calls "robotic" is almost always the
     device's default compact voice — most platforms also ship a better one
     that the default picker never reaches for. iOS/macOS label theirs
     "Enhanced" or "Premium"; some Android and Chrome builds expose a
     "Natural" or "Neural" voice alongside the plain one. Given a choice,
     take the better-sounding voice over an earlier one in the list. */
  var QUALITY_HINTS = /enhanced|premium|neural|natural|wavenet|studio|hd\b/i;

  /* Chooses a voice for a language, preferring, in order: an exact match for
     the requested locale (en-SG, spoken to sound Singaporean rather than
     British or American); a voice that sounds female, because a primary
     school child hears mostly female teachers and that is the voice a
     parent expects reading these questions; any voice in the same language
     at all, so the app never falls silent just because en-SG is not
     installed on this device. */
  function voiceFor(lang){
    if(!voices.length) refreshVoices();
    var want = lang.toLowerCase(), base = want.split("-")[0];
    var sameLocale = [], sameLang = [], i, v, vl;
    for(i = 0; i < voices.length; i++){
      v = voices[i]; vl = String(v.lang || "").toLowerCase().replace("_","-");
      if(vl === want) sameLocale.push(v);
      else if(vl.split("-")[0] === base) sameLang.push(v);
    }
    function female(v){ return FEMALE_VOICE_HINTS.test(v.name || ""); }
    function notMale(v){ return !MALE_VOICE_HINTS.test(v.name || ""); }
    function quality(v){ return QUALITY_HINTS.test(v.name || ""); }
    function pickFrom(list){
      if(!list.length) return null;
      /* A high-quality female voice first; then any high-quality voice at
         all, since a smoother male voice still beats a robotic female one;
         then the same female-over-male fallback as before. */
      var qf = list.filter(function(v){ return quality(v) && female(v); }); if(qf.length) return qf[0];
      var q = list.filter(quality); if(q.length) return q[0];
      var f = list.filter(female); if(f.length) return f[0];
      var n = list.filter(notMale); if(n.length) return n[0];
      return list[0];
    }
    return pickFrom(sameLocale) || pickFrom(sameLang) || null;
  }
  function speak(text, opts){
    if(!CAN_SPEAK || !text) return false;
    if(state && state.sound === false) return false;
    opts = opts || {};
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(text));
      /* en-SG so a device that has it sounds like a Singaporean teacher
         rather than a British or American one; voiceFor() falls back
         through plain "en" if this device has no en-SG voice installed. */
      u.lang = opts.lang || "en-SG";
      /* Slower than default: these are children hearing a word once. */
      u.rate = opts.rate || 0.9;
      u.pitch = opts.pitch || 1.0;
      var v = voiceFor(u.lang);
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
      return true;
    }catch(e){ return false; }
  }
  /* ---------- reading the question out loud ----------
     Rather than adding a speak() call to each of fifty-odd games — and
     forgetting it on the next one — this watches the stage and reads whatever
     question has just appeared. One place, every game, including games not
     written yet.

     Action games are skipped: a cannon arena has no question to read, and the
     stage changes on every shot. */
  var lastSpoken = "";
  function stageQuestion(stage){
    if(!stage) return "";
    if(stage.querySelector(".sea, .arena, .memgrid, .pads, .duo-board, canvas")) return "";
    var bits = [];
    var p = stage.querySelector(".prompt");
    if(p) bits.push(p.textContent.trim());
    var q = stage.querySelector(".bigq, .sentence, .idiom, .passage");
    if(q) bits.push(q.textContent.trim());
    /* A fill-in-the-blank sentence has "___" right in its text. Read
       literally, that comes out as the TTS engine spelling out
       "underscore" once per character. A child hearing a gap does not
       need it named at all — just a short breath, then the sentence
       carries on. */
    return bits.filter(Boolean).join(". ").replace(/_{2,}/g, "...").replace(/\s+/g, " ").trim();
  }
  function readStage(){
    if(!CAN_SPEAK || (state && state.sound === false) || (state && state.readAloud === false)) return;
    var stage = document.querySelector(".stage");
    var text = stageQuestion(stage);
    /* Chinese games say their own character in Mandarin a moment later, and
       that call cancels this one, which is the order we want. */
    if(!text || text === lastSpoken || text.length > 240) return;
    lastSpoken = text;
    speak(text);
  }
  var readTimer = null;
  function watchStage(){
    if(!window.MutationObserver) return;
    var obs = new MutationObserver(function(){
      if(readTimer) clearTimeout(readTimer);
      readTimer = setTimeout(readStage, 320);
    });
    obs.observe($("screen"), {childList:true, subtree:true});
  }

  /* A round speaker the child can tap to hear it again. Returns null when the
     device has no voices at all, so callers can leave the layout alone. */
  function sayButton(text, opts){
    if(!CAN_SPEAK) return null;
    var b = el("button",{"class":"saybtn", "aria-label":"Hear it again", text:"🔊"});
    b.addEventListener("click", function(e){
      e.stopPropagation();
      speak(typeof text === "function" ? text() : text, opts);
    });
    return b;
  }

  /* ---------- confetti ----------
     Drawn on one full-screen canvas that is created on demand and thrown away
     when the last piece lands, so there is nothing sitting over the page
     catching taps the rest of the time. Motion is by delta time, not by frame,
     so it looks the same on a 60Hz iPad and a 120Hz one. */
  var confCanvas = null, confCtx = null, confPieces = [], confRAF = null;
  var CONF_COLOURS = ["#FFC43D","#FF5D8F","#2FB6E6","#35C48F","#9B7BFF","#FF8A5B","#FFFFFF"];

  function confettiBurst(count, originY){
    /* A child who would rather not have things flying about can turn it off,
       and anyone who has asked the system for less motion gets none. */
    if(state.motion === false) return;
    try{
      if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    }catch(e){}

    if(!confCanvas){
      confCanvas = el("canvas",{style:"position:fixed; inset:0; z-index:35; pointer-events:none"});
      document.body.appendChild(confCanvas);
      confCtx = confCanvas.getContext("2d");
    }
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    confCanvas.width = window.innerWidth * dpr;
    confCanvas.height = window.innerHeight * dpr;
    confCanvas.style.width = window.innerWidth + "px";
    confCanvas.style.height = window.innerHeight + "px";
    confCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var W = window.innerWidth, H = window.innerHeight;
    var y0 = originY == null ? H * 0.42 : originY;
    var i;
    for(i = 0; i < count; i++){
      var angle = (Math.PI * 2 * i) / count + Math.random() * .4;
      var speed = 260 + Math.random() * 420;
      confPieces.push({
        x: W / 2 + (Math.random() - .5) * 120,
        y: y0,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 220,
        size: 7 + Math.random() * 9,
        spin: (Math.random() - .5) * 14,
        rot: Math.random() * 6.3,
        life: 1.5 + Math.random() * 1.1,
        age: 0,
        c: pick(CONF_COLOURS)
      });
    }
    if(!confRAF) confRAF = requestAnimationFrame(confStep);
  }

  var confLast = 0;
  function confStep(now){
    if(!confLast) confLast = now;
    var dt = Math.min((now - confLast) / 1000, .05);
    confLast = now;
    confCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    var alive = [], i, p;
    for(i = 0; i < confPieces.length; i++){
      p = confPieces[i];
      p.age += dt;
      if(p.age >= p.life) continue;
      p.vy += 900 * dt;          // gravity
      p.vx *= (1 - 1.1 * dt);    // air
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.spin * dt;
      if(p.y > window.innerHeight + 40) continue;

      confCtx.save();
      confCtx.globalAlpha = Math.max(0, 1 - p.age / p.life);
      confCtx.translate(p.x, p.y);
      confCtx.rotate(p.rot);
      confCtx.fillStyle = p.c;
      confCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      confCtx.restore();
      alive.push(p);
    }
    confPieces = alive;

    if(confPieces.length){ confRAF = requestAnimationFrame(confStep); }
    else {
      confRAF = null; confLast = 0;
      if(confCanvas && confCanvas.parentNode){ confCanvas.parentNode.removeChild(confCanvas); }
      confCanvas = null; confCtx = null;
    }
  }

  var LEVEL_RANK = {N:0, K1:1, K2:2, P1:3, P2:4, P3:5, P4:6, P5:7, P6:8};
  function rank(){ return LEVEL_RANK[schoolLevel()] || 0; }
  function isSenior(){ return rank() >= 7; }   // P5 and P6

  /* Difficulty still moves in four broad steps, but which games a child is
     shown follows their exact school level: nine years old means P3, not
     "somewhere between P3 and P6". */
  var LEVELS = ["N","K1","K2","P1","P2","P3","P4","P5","P6"];
  function levelForAge(age){
    if(age <= 4) return "N";
    if(age >= 12) return "P6";
    return LEVELS[age - 4];

  /* Pick items for this band, falling back to the nearest ones if a bank is thin. */

  /* ---------- not asking the same thing twice ----------
     Shuffling a pool at the start of a round is not enough. A round is eight
     questions and some of these banks hold six items for a child's age, so
     the same round asked one of them twice and the next sitting was the same
     six cards in a new order. A child notices that in about four minutes.

     So each game keeps a bag. Items are dealt out of it and not put back, so
     nothing is asked again until everything else has been; the bag lives in
     saved state, so closing the app and coming back tomorrow carries on where
     she left off rather than starting the same six questions again. When the
     bag empties a fresh cycle begins.

     If a bank is smaller than a round it must repeat, but only after every
     other item has had its turn.  */
  function bagOf(id){
    if(!state.bags) state.bags = {};
    var b = state.bags[id];
    return (b && b.length !== undefined) ? b : [];
  }
  function deal(id, pool, keyOf, n){
    if(!pool || !pool.length) return [];
    var bag = bagOf(id), out = [], i, left, it;
    for(i = 0; i < n; i++){
      left = pool.filter(function(x){ return bag.indexOf(keyOf(x)) < 0; });
      if(!left.length){
        /* The bag ran out. A new cycle carries the most recent quarter of the
           old one forward, and keeps what this round has already asked out of
           it, so the cycle boundary does not hand straight back the question
           before last. */
        bag = bag.slice(Math.max(0, bag.length - Math.floor(pool.length / 4)));
        left = pool.filter(function(x){
          return bag.indexOf(keyOf(x)) < 0 && out.indexOf(x) < 0; });
        if(!left.length) left = pool.filter(function(x){ return out.indexOf(x) < 0; });
        if(!left.length) left = pool.slice();
      }
      it = pick(left);
      out.push(it);
      bag.push(keyOf(it));
    }
    if(!state.bags) state.bags = {};
    state.bags[id] = bag;
    save();
    return out;
  }
  /* An item's identity is the whole item, not one of its fields. Picking a
     likely-looking field guesses wrong: in the measure-word bank "w" is the
     measure word, so every noun taking 只 counted as the same question and
     the bag thought it had dealt them all after three. Hashing the entry
     cannot collide that way, and the keys stay short enough to save. */
  function hashKey(str){
    var h = 5381, i;
    for(i = 0; i < str.length; i++) h = (((h << 5) + h) ^ str.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }

    return function(it){
      if(it == null) return "";
      return hashKey(typeof it === "object" ? JSON.stringify(it) : String(it));
    };
  }
  /* The usual call: deal a round's worth out of a band's pool. */
  function dealBand(id, list, n){
    return deal(id, forBand(list, band()), keyer(), n);
  }

  function forBand(list, b){
    var exact = list.filter(function(x){ return x.b === b; });
    if(exact.length >= 4) return exact;
    var near = list.filter(function(x){ return Math.abs(x.b - b) <= 1; });
    return near.length >= 4 ? near : list;
  }

  /* ---------- earning your way in ----------
   *
   * Stars open new games. The cost is worked out from a game's place on its
   * subject's path rather than written on each game, so it stays right as
   * games are added — and because it is per subject, the first two games of
   * every subject are always open. A child is never left staring at a wall of
   * locks, and never runs out of something to play in the subject they like.
   *
   * Locked games are shown, not hidden: seeing what is coming is most of the

  /* The ladder has to be at least as long as the longest subject path, or

     games and a dozen of them all sat waiting on the same 320 stars, so

  var STAR_GATES = [0, 0, 15, 35, 60, 90, 125, 165, 210, 260, 320,

                    1040, 1100, 1160, 1220];
  var starGateCache = null, starGateLevel = null;

  /* Counted over the games this child can actually see, not the whole path.
     Ten Frame and Number Bonds sit before Number Quest on the maths journey,
     but a P3 child is never shown them — so counting the whole path put the
     first maths game a nine-year-old sees behind fifteen stars, with nothing
     open above it. Recomputed when the age changes. */
  function starGates(){
    var lvl = schoolLevel();
    if(starGateCache && starGateLevel === lvl) return starGateCache;
    starGateCache = {}; starGateLevel = lvl;

    var visible = {};
    WORLDS.filter(suitsAge).forEach(function(w){ visible[w.id] = true; });

    SUBJECTS.forEach(function(sub){
      var ids = (JOURNEY[sub.k] || []).filter(function(id){ return visible[id]; });
      ids.forEach(function(id, idx){
        starGateCache[id] = STAR_GATES[Math.min(idx, STAR_GATES.length - 1)];
      });
    });
    /* Anything not on a path stays open rather than being locked by accident. */
    WORLDS.forEach(function(w){ if(starGateCache[w.id] == null) starGateCache[w.id] = 0; });
    return starGateCache;
  }
  function starCost(id){ return starGates()[id] || 0; }

    if(played(w.id)) return false;            // never take back a game already met
    return (state.stars || 0) < starCost(w.id);
  }
  function nextUnlock(){
    var best = null;
    WORLDS.filter(suitsAge).forEach(function(w){
      if(!starLocked(w)) return;
      var c = starCost(w.id);
      if(!best || c < best.cost) best = {w:w, cost:c};
    });

  function nextStep(){

    var i, j, ids, id;

        var cand = worldById(id);
        if(cand && starLocked(cand)) continue;
        if(!played(id)) return {w:cand, why:"You haven't tried this one yet."};
        if(!mastered(id)) return {w:worldById(id), why:"You're on Level " + levelOf(id) + ". Reach Level " + MASTER + " to master it."};

  /* ---------- the progress screen ---------- */
  function renderProgress(){
    var wrap = el("div");
    var bar = el("div",{"class":"gamebar"});
    var back = el("button",{"class":"iconbtn","aria-label":"Back to the games", text:"←"});
    back.addEventListener("click", function(){ sfx.tap(); renderHome(); });
    bar.appendChild(back);
    bar.appendChild(el("div",{"class":"who", style:"margin-left:4px"},
      el("div",{"class":"hi", text:"Progress"}),
      el("div",{"class":"nm display", text: state.name || "Friend"})
    ));
    wrap.appendChild(bar);

    var pad = el("div",{"class":"pad"});

    var tiles = el("div",{"class":"stats"});
    [["⭐", state.stars, "stars"],
     ["🔥", state.streak, state.streak === 1 ? "day streak" : "days streak"],
     ["🎮", playedCount(), "games tried"],
     ["🏅", earnedBadges().length, "badges"]].forEach(function(t){
      tiles.appendChild(el("div",{"class":"stat"},
        el("div",{"class":"se", text:t[0]}),
        el("div",{"class":"sv", text:String(t[1])}),
        el("div",{"class":"sl", text:t[2]})));
    });
    pad.appendChild(tiles);

    /* What the next stars actually buy. Knowing a named game is three stars
       away is a far better reason to play one more round than a number going
       up on its own. */
    var up = nextUnlock();
    if(up){
      var short = up.cost - (state.stars || 0);
      var goal = el("div",{"class":"unlocknext"});
      goal.appendChild(el("div",{"class":"un-e", text:up.w.emo}));
      var mid = el("div",{"class":"un-mid"});
      mid.appendChild(el("div",{"class":"un-l", text:"Next to unlock"}));
      mid.appendChild(el("div",{"class":"un-n", text:up.w.nm}));
      mid.appendChild(el("div",{"class":"un-s", text:up.w.sub}));
      var bar = el("div",{"class":"un-track"});
      var got = el("div",{"class":"un-fill"});
      /* Measured from the gate before this one, so the bar starts where the
         last unlock left off rather than always near empty. */
      var prev = 0;
      STAR_GATES.forEach(function(g){ if(g < up.cost && g > prev) prev = g; });
      var span = Math.max(1, up.cost - prev);
      got.style.width = Math.max(4, Math.min(100, ((state.stars || 0) - prev) / span * 100)) + "%";
      bar.appendChild(got);
      mid.appendChild(bar);
      mid.appendChild(el("div",{"class":"un-w",
        text: "⭐ " + short + " more star" + (short === 1 ? "" : "s") + " to go"}));
      goal.appendChild(mid);
      pad.appendChild(goal);
    } else if(WORLDS.filter(suitsAge).length){
      pad.appendChild(el("div",{"class":"unlocknext done"},
        el("div",{"class":"un-e", text:"🔓"}),
        el("div",{"class":"un-mid"},
          el("div",{"class":"un-l", text:"All open"}),
          el("div",{"class":"un-n", text:"Every game at your level is unlocked"}),
          el("div",{"class":"un-s", text:"Keep earning stars to fill in the badges."}))));
    }

    var nx = nextStep();
    if(nx){
      var card = el("button",{"class":"nextcard"});
      card.appendChild(el("div",{"class":"ne", text:nx.w.emo}));
      card.appendChild(el("div",{},
        el("div",{"class":"nl", text:"Next up"}),
        el("div",{"class":"nn", text:nx.w.nm}),
        el("div",{"class":"nw", text:nx.why})));
      card.appendChild(el("div",{"class":"go", text:"▶"}));
      card.addEventListener("click", function(){ sfx.tap(); startGame(nx.w); });
      pad.appendChild(card);
    } else {
      pad.appendChild(el("div",{"class":"nextcard done"},
        el("div",{"class":"ne", text:"🎉"}),
        el("div",{}, el("div",{"class":"nn", text:"Every game mastered!"}),
                     el("div",{"class":"nw", text:"Change your age in the player settings for a harder set."}))));
    }

    SUBJECTS.forEach(function(sub){
      var ids = (JOURNEY[sub.k] || []).filter(function(id){
        var w = worldById(id); return w && suitsAge(w);
      });
      if(!ids.length) return;
      var done = ids.filter(mastered).length;
      pad.appendChild(el("h3",{"class":"subject", text:sub.nm}));
      var track = el("div",{"class":"track"});
      var fill = el("div",{"class":"fill"});
      fill.style.width = Math.round(done / ids.length * 100) + "%";
      track.appendChild(fill);
      pad.appendChild(track);
      pad.appendChild(el("div",{"class":"trackn", text: done + " of " + ids.length + " mastered"}));

      var path = el("div",{"class":"path"});
      ids.forEach(function(id){
        var w = worldById(id);
        var gatedStep = starLocked(w);
        var state2 = mastered(id) ? "done" : played(id) ? "doing" : "todo";
        var step = el("button",{"class":"step " + state2 + (gatedStep ? " gatedstep" : "")});
        step.appendChild(el("div",{"class":"pe", text: state2 === "done" ? "✓" : w.emo}));
        step.appendChild(el("div",{"class":"pn", text:w.nm}));
        /* The path is the map, so a locked game is named here even though the
           card on the home screen keeps it a mystery — but it still has to say
           it is locked, or the two screens contradict each other. */
        step.appendChild(el("div",{"class":"pl",
          text: gatedStep ? ("⭐ " + (starCost(id) - (state.stars || 0)) + " more")
              : played(id) ? ("Lv " + levelOf(id)) : "Not started"}));
        step.addEventListener("click", function(){
          sfx.tap();
          if(gatedStep){
            banner("⭐ " + (starCost(id) - (state.stars || 0)) + " more to open this one");
            return;
          }
          startGame(w);
        });
        path.appendChild(step);
      });
      pad.appendChild(path);
    });

    pad.appendChild(el("h3",{"class":"subject", text:"Badges"}));
    var got = earnedBadges().map(function(x){ return x.id; });
    var bg = el("div",{"class":"badges"});
    BADGES.forEach(function(bd){
      var has = got.indexOf(bd.id) >= 0;
      bg.appendChild(el("div",{"class":"badge" + (has ? " has" : ""), title:bd.hint},
        el("div",{"class":"be", text:bd.e}),
        el("div",{"class":"bn", text: has ? bd.nm : bd.hint})));
    });
    pad.appendChild(bg);

    wrap.appendChild(pad);
    show(wrap);
  }

  function suitsAge(w){ return (w.levels || []).indexOf(schoolLevel()) >= 0; }
  function unlocked(w){ return licence ? (licence.trial ? w.free : true) : false; }

  /* ---------- screens ---------- */
  /* The last game card that was opened, and how far down the list it sat.
     Coming back out of a game should put a child back where they were, not at
     the top of a list they have to scroll through again. */
  var lastOpened = null, lastScroll = 0;

  function show(node){
    var s = $("screen");
    s.textContent = "";
    s.scrollTop = 0;
    s.appendChild(node);
  }

  /* Called at the end of renderHome, once the cards are in the document and
     have a position to scroll to. */
  function restoreHomeView(){
    var s = $("screen");
    if(!lastOpened){ s.scrollTop = 0; return; }
    var card = s.querySelector('[data-world="' + lastOpened + '"]');
    if(!card){ s.scrollTop = lastScroll || 0; return; }
    /* Put the card a little above centre, so the ones after it are in view —
       that is usually where a child is heading next. */
    var top = card.offsetTop - (s.clientHeight / 2) + (card.offsetHeight / 2);
    s.scrollTop = Math.max(0, top);
    card.classList.add("justplayed");
    setTimeout(function(){ card.classList.remove("justplayed"); }, 1600);
  }

  function topbar(){
    var bar = el("div",{"class":"topbar"});
    var av = el("button",{"class":"avatar","aria-label":"Change name or character"}, state.avatar);
    av.addEventListener("click", function(){ sfx.tap(); openProfile(); });
    bar.appendChild(av);
    bar.appendChild(el("div",{"class":"who"},
      el("div",{"class":"hi", text:"Playing"}),
      el("div",{"class":"nm display", text: state.name || "Friend"})
    ));
    bar.appendChild(el("div",{"class":"tally"}, "⭐", el("b",{text:String(state.stars)})));
    if(state.streak > 0) bar.appendChild(el("div",{"class":"tally"}, "🔥", el("b",{text:String(state.streak)})));
    return bar;
  }

  function renderHome(){
    refreshWritings();
    /* The game screens have had their own mood music for a while; the game
       picker itself stayed silent, which made arriving here after a round
       feel like the sound had cut out rather than like a menu. music.start
       is a no-op if it is already playing this same mood, and startGame()
       switches to the game's own mood the moment one is picked, so this
       only ever plays while a child is actually choosing. */
    music.start("calm");
    var wrap = el("div");
    wrap.appendChild(topbar());
    var pad = el("div",{"class":"pad"});

    if(licence){
      var pill = el("div",{"class":"pill " + (licence.trial ? "trial" : "full")});
      if(licence.trial){
        var d = licenceExp ? Math.max(0, Math.ceil((licenceExp*1000 - Date.now())/86400000)) : null;
        pill.textContent = d === null ? "Sample games"
          : d <= 0 ? "Sample ends today"
          : d === 1 ? "Sample · 1 day left"
          : "Sample · " + d + " days left";
        var up = el("button",{"class":"linkbtn", id:"pc_upgrade", text:"About full access"});
        up.addEventListener("click", function(){ sfx.tap(); openKey(); });
        pad.appendChild(el("div",{style:"display:flex; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:8px"}, pill, up));
      } else {
        pill.textContent = "Everything unlocked";
        pad.appendChild(el("div",{style:"margin-bottom:8px"}, pill));
      }
    }

    /* Only the games for this child's exact school level. Change the age in
       the player settings and a different set appears. */
    var fit = WORLDS.filter(suitsAge);

    var nx = nextStep();
    if(nx){
      var ncard = el("button",{"class":"nextcard"});
      ncard.appendChild(el("div",{"class":"ne", text:nx.w.emo}));
      ncard.appendChild(el("div",{},
        el("div",{"class":"nl", text:"Next up for you"}),
        el("div",{"class":"nn", text:nx.w.nm}),
        el("div",{"class":"nw", text:nx.why})));
      ncard.appendChild(el("div",{"class":"go", text:"▶"}));
      ncard.addEventListener("click", function(){
        sfx.tap();
        if(!unlocked(nx.w)){ openKey(); return; }
        lastOpened = nx.w.id;
        lastScroll = $("screen").scrollTop;
        startGame(nx.w);
      });
      pad.appendChild(ncard);
    }

    pad.appendChild(el("h2",{"class":"section-title",
      text:"Made for age " + (state.age || 5) + " · " + levelName(schoolLevel())}));
    var grid = el("div",{"class":"worlds"});
    function addCards(list, into){
    list.forEach(function(w){
      var gated = starLocked(w);
      var card = el("button",{"class":"world" + (gated ? " gated" : ""), style:"background:"+w.bg});

      if(gated){
        /* A shape rather than a blank: the emoji is silhouetted so a child can
           half-guess what it is, and the cost is the loudest thing on it. */
        var need = starCost(w.id) - (state.stars || 0);
        card.appendChild(el("div",{"class":"emo hidden-emo", text:w.emo}));
        card.appendChild(el("div",{"class":"nm", text:"? ? ?"}));
        card.appendChild(el("div",{"class":"sub", text:"A new game is waiting in here"}));
        card.appendChild(el("div",{"class":"gatepill"},
          el("span",{text:"⭐"}),
          el("span",{text: need + " more star" + (need === 1 ? "" : "s")})));
      } else {
        card.appendChild(el("div",{"class":"emo", text:w.emo}));
        card.appendChild(el("div",{"class":"nm", text:w.nm}));
        card.appendChild(el("div",{"class":"sub", text:w.sub}));
        if(w.sg) card.appendChild(el("div",{"class":"sgtag", text:w.sg}));
        card.appendChild(el("div",{"class":"lvl", text:"Level " + levelOf(w.id) + (starsOf(w.id) ? "  ·  ⭐ " + starsOf(w.id) : "")}));
        if(!unlocked(w)) card.appendChild(el("div",{"class":"lock"}, el("span",{text:"🔒  Unlock"})));
      }

      card.setAttribute("data-world", w.id);
      card.addEventListener("click", function(){
        sfx.tap();
        if(!licence){ openWelcome(false); return; }
        if(gated){
          var short = starCost(w.id) - (state.stars || 0);
          banner("⭐ " + short + " more to open this one");
          foxReact("oops");
          return;
        }
        if(!unlocked(w)){ openKey(); return; }
        lastOpened = w.id;
        lastScroll = $("screen").scrollTop;
        startGame(w);
      });
      into.appendChild(card);
    });
    }
    /* Twenty-one games in one grid is a wall. Parents look by subject. */
    SUBJECTS.forEach(function(sub){
      var group = fit.filter(function(w){ return w.cat === sub.k; });
      if(!group.length) return;
      pad.appendChild(el("h3",{"class":"subject", text:sub.nm}));
      /* Within a subject, keep related games together — all the living-things
         games in one row, all the money and time games in another. */
      var topics = [];
      group.forEach(function(w){
        var t = w.topic || sub.nm;
        if(topics.indexOf(t) < 0) topics.push(t);
      });
      topics.forEach(function(t){
        var inTopic = group.filter(function(w){ return (w.topic || sub.nm) === t; });
        if(topics.length > 1 || t !== sub.nm) pad.appendChild(el("h4",{"class":"topic", text:t}));
        var gg = el("div",{"class":"worlds"});
        addCards(inTopic, gg);
        pad.appendChild(gg);
      });
    });


    pad.appendChild(el("h3",{"class":"subject", text:"✍️ Written by Kids"}));
    var wgrid = el("div",{"class":"worlds"});
    var wcard = el("button",{"class":"world", "data-world":"write-own", style:"background:linear-gradient(150deg,#FFD9A0,#E8863D)"});
    wcard.appendChild(el("div",{"class":"emo", text:"✍️"}));
    wcard.appendChild(el("div",{"class":"nm", text:"Write your own sentence"}));
    wcard.appendChild(el("div",{"class":"sub", text:"Get it approved and it becomes a real game"}));
    wcard.addEventListener("click", function(){
      sfx.tap();
      if(!licence){ openWelcome(false); return; }
      openWriting();
    });
    wgrid.appendChild(wcard);
    approvedWritings.forEach(function(w){
      var isDrawing = w.type === "drawing";
      var c = el("button",{"class":"world", "data-world":"writing-" + w.id,
        style: isDrawing ? "background:#fff; padding:0; overflow:hidden"
                         : "background:linear-gradient(150deg,#FFC2E0,#D6569C)"});
      if(isDrawing){
        c.appendChild(el("img",{src:w.imageDataUrl, alt:"A drawing by " + (w.childName || "a player"),
          style:"width:100%; height:96px; object-fit:cover; display:block"}));
        c.appendChild(el("div",{"class":"nm", style:"padding:10px 12px 0; color:#3A3286", text:"A drawing"}));
        c.appendChild(el("div",{"class":"sub", style:"padding:0 12px 12px; color:#6E67A6", text:"by " + (w.childName || "a player")}));
      } else {
        c.appendChild(el("div",{"class":"emo", text:"📝"}));
        c.appendChild(el("div",{"class":"nm", text:"“" + w.sentence.split(" ").slice(0,4).join(" ") + (w.sentence.split(" ").length > 4 ? "…" : "") + "”"}));
        c.appendChild(el("div",{"class":"sub", text:"by " + (w.childName || "a player")}));
      }
      c.addEventListener("click", function(){
        sfx.tap();
        if(!licence){ openWelcome(false); return; }
        if(isDrawing) viewDrawing(w); else playWriting(w);
      });
      wgrid.appendChild(c);
    });
    pad.appendChild(wgrid);

    var print = el("button",{"class":"printcard"});
    print.appendChild(el("div",{"class":"pe", text:"🖨️"}));
    print.appendChild(el("div",{},
      el("div",{"class":"pn", text:"Print at home"}),
      el("div",{"class":"ps", text:"Thirteen kinds of worksheet to download as a PDF or print — tracing, maths, mazes, word searches and more."})
    ));
    print.appendChild(el("div",{"class":"go", text:"→"}));
    print.addEventListener("click", function(){
      sfx.tap();
      if(!licence){ openWelcome(false); return; }
      window.location.href = "worksheets.html";
    });
    pad.appendChild(print);

    var row = el("div",{"class":"footrow"});
    var pg = el("button",{"class":"btn btn-ghost", text:"My progress"});
    pg.addEventListener("click", function(){ sfx.tap(); renderProgress(); });
    row.appendChild(pg);
    var gu = el("button",{"class":"btn btn-ghost", text:"Grown-up corner"});
    gu.addEventListener("click", function(){ sfx.tap(); openGrownup(); });
    var ab = el("button",{"class":"btn btn-ghost", text:"About Fun Game"});
    ab.addEventListener("click", function(){ sfx.tap(); openAbout(); });
    row.appendChild(gu); row.appendChild(ab);
    pad.appendChild(row);

    wrap.appendChild(pad);
    show(wrap);
    restoreHomeView();
    maybeOfferIOSInstall();
  }

  /* ---------- shell shared by every game ---------- */
  function gameShell(world, total){
    var wrap = el("div",{style:"flex:1; min-height:0; display:flex; flex-direction:column"});
    var bar = el("div",{"class":"gamebar"});
    var back = el("button",{"class":"iconbtn","aria-label":"Back to the games", text:"←"});
    back.addEventListener("click", function(){ sfx.tap(); runStreak = 0; music.stop(); renderHome(); });
    bar.appendChild(back);
    var dots = el("div",{"class":"dots"});
    for(var i=0;i<total;i++) dots.appendChild(el("div",{"class":"dot"}));
    bar.appendChild(dots);
    bar.appendChild(el("div",{"class":"tally"}, world.emo, el("b",{text:"Lv " + levelOf(world.id)})));
    wrap.appendChild(bar);
    var stage = el("div",{"class":"stage"});
    wrap.appendChild(stage);
    show(wrap);
    return {stage:stage, dots:dots};
  }
  function markDot(dots, i, ok){
    var d = dots.children[i];
    if(d) d.className = "dot " + (ok ? "on" : "bad");
  }

  function finish(world, correct, total){
    var stars = correct === total ? 3 : correct >= Math.ceil(total*0.8) ? 2 : correct >= Math.ceil(total*0.5) ? 1 : 0;
    var passed = correct >= Math.ceil(total * 0.7);
    if(stars === 3) state.perfects = (state.perfects || 0) + 1;
    var beforeLevel = levelOf(world.id);
    award(world.id, stars, passed);
    runStreak = 0;
    if(stars === 3){ sfx.win(); confettiBurst(120, window.innerHeight * 0.3); }
    else if(stars === 2){ sfx.win(); confettiBurst(50); }
    else if(passed) sfx.levelup();
    if(passed && levelOf(world.id) > beforeLevel) setTimeout(function(){ sfx.levelup(); }, 700);

    music.stop();
    var wrap = el("div",{"class":"result"});
    wrap.appendChild(el("div",{"class":"stars-big", text: stars ? new Array(stars+1).join("⭐") : "💪"}));
    wrap.appendChild(el("div",{"class":"score display", text: correct + " out of " + total}));
    wrap.appendChild(el("div",{style:"font-weight:800; color:#C9C4EE; font-size:16px",
      text: stars === 3 ? "Perfect! Every single one."
          : stars === 2 ? "Really good — nearly all of them."
          : stars === 1 ? "Nice work. Try that level again?"
          : "Tricky one. Have another go — you'll get it."}));
    if(passed) wrap.appendChild(el("div",{style:"font-weight:800; color:#8FE3C4; font-size:16px", text:"Level " + levelOf(world.id) + " unlocked!"}));

    var again = el("button",{"class":"btn btn-lg btn-go", style:"min-width:240px", text:"Play again"});
    again.addEventListener("click", function(){ sfx.tap(); startGame(world); });
    var home = el("button",{"class":"btn btn-lg btn-ghost", style:"min-width:240px", text:"Choose another game"});
    home.addEventListener("click", function(){ sfx.tap(); renderHome(); });
    wrap.appendChild(again); wrap.appendChild(home);
    show(wrap);
  }

  /* A run of right answers in a row. It resets on a wrong one and on leaving a
     game, and it is what drives the rising chime and the "3 in a row!" pill. */
  var runStreak = 0;
  function rightAnswer(el2){
    runStreak++;
    sfx.good();
    if(runStreak >= 3) sfx.streak(runStreak);
    sparkle(el2);
    foxReact("cheer");
    if(runStreak === 3 || runStreak === 5 || runStreak === 8 || runStreak >= 10) {
      confettiBurst(runStreak >= 8 ? 70 : 40);
      banner(runStreak + " in a row!");
    }
  }
  function wrongAnswer(){
    runStreak = 0;
    sfx.bad();
    foxReact("oops");
  }
  function foxReact(cls){
    var a = document.querySelector(".avatar");
    if(!a || state.motion === false) return;
    a.classList.remove("cheer","oops");
    void a.offsetWidth;
    a.classList.add(cls);
    setTimeout(function(){ a.classList.remove(cls); }, 800);
  }
  /* A short pill that rises over the stage and goes away by itself. */
  function banner(text){
    var host = document.querySelector(".stage") || $("screen");
    if(!host) return;
    var b = el("div",{"class":"streakpill", text:"🔥  " + text});
    b.style.cssText += "position:fixed; left:50%; transform:translateX(-50%); top:84px; z-index:33";
    document.body.appendChild(b);
    setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 1500);
  }

  function choiceGrid(options, answer, onDone, emoStyle, zhStyle){
    var grid = el("div",{"class":"choices" + (options.length === 3 ? " three" : "")});
    var locked = false;
    options.forEach(function(opt){
      var label = String(opt && opt.label != null ? opt.label : opt);
      var value = String(opt && opt.value != null ? opt.value : opt);
      var b = el("button",{"class":"choice" + (emoStyle ? " emo" : zhStyle ? " zh" : ""), text:label});
      b.addEventListener("click", function(){
        if(locked) return;
        locked = true;
        var ok = value === String(answer);
        b.classList.add(ok ? "right" : "wrong");
        if(ok){ sparkle(b); }
        else {
          Array.prototype.forEach.call(grid.children, function(c){
            if(c === b) return;
            if(c.textContent === String(answer)) c.classList.add("right");
            else c.classList.add("dim");
          });
        }
        onDone(ok);
      });
      grid.appendChild(b);
    });
    return grid;
  }

  /* A question list is the shape most of these games take. */
  function runQuestions(world, questions, render){
    var shell = gameShell(world, questions.length);
    var i = 0, correct = 0;
    function next(){
      if(i >= questions.length){ finish(world, correct, questions.length); return; }
      shell.stage.textContent = "";
      render(questions[i], shell.stage, function(ok){
        if(ok){ correct++; rightAnswer(); flash("⭐"); } else { wrongAnswer(); }
        markDot(shell.dots, i, ok);
        i++;
        setTimeout(next, ok ? 620 : 1050);
      });
    }
    next();
  }

  /* ---------- Number Quest ---------- */
  /* The question types change with age, not just the size of the numbers:
     counting pictures at 3, times tables at 8, missing numbers at 11. */
  /* Four choices by default; three for the youngest, where a wall of options
     is most of the difficulty. */
  function numberOptions(ans, spread, total){
    var want = Math.max(2, (total || 4)) - 1;
    var wrongs = [], guard = 0;
    while(wrongs.length < want && guard++ < 120){
      var d = ans + ri(-spread, spread);
      if(d !== ans && d >= 0 && wrongs.indexOf(d) < 0) wrongs.push(d);
    }
    var bump = 1;
    while(wrongs.length < want){
      var alt = ans + bump;
      if(alt >= 0 && alt !== ans && wrongs.indexOf(alt) < 0) wrongs.push(alt);
      bump = bump > 0 ? -bump : -bump + 1;
      if(bump > 30) break;
    }
    return shuffle([ans].concat(wrongs));
  }
  function buildNumbers(level){
    var b = band(), qs = [], i, count = b === 0 ? 5 : b === 1 ? 7 : 8;
    for(i=0;i<count;i++) qs.push(numberQuestion(b, level));
    return qs;
  }
  function numberQuestion(b, level){
    var a, c, ans, kinds;
    if(b === 0){
      /* Three and four year olds. Counting to five before counting to ten,
         three choices rather than four, and the numbers grow only as the
         child clears levels — the first sums a preschooler meets should be
         ones they can get right. */
      kinds = ["count","count","count","plus1"];
      var kind = pick(kinds);
      if(kind === "count"){
        var n = ri(1, Math.min(2 + level, 6));
        var emo = pick(PICS).e;
        return {emoji: new Array(n+1).join(emo + " "), prompt:"How many?", a:n,
          opts:numberOptions(n, 2, 3)};
      }
      a = ri(1, Math.min(2 + level, 5));
      ans = a + 1;
      return {q: a + " + 1", prompt:"What is…", a:ans, opts:numberOptions(ans, 2, 3)};
    }
    if(b === 1 && level <= 2){
      /* Five and six, just starting: keep the first couple of levels inside
         ten so the game is a win before it is a test. */
      a = ri(1, 6); c = ri(1, Math.min(4, 10 - a));
      return {q: a + " + " + c, prompt:"What is…", a:a+c, opts:numberOptions(a+c, 3, 3)};
    }
    if(b === 1){
      a = ri(1, Math.min(6 + level*2, 20));
      c = ri(1, Math.min(6 + level*2, 20));
      if(Math.random() < .5) return {q: a + " + " + c, prompt:"What is…", a:a+c, opts:numberOptions(a+c, 5)};
      if(c > a){ var t = a; a = c; c = t; }
      return {q: a + " − " + c, prompt:"What is…", a:a-c, opts:numberOptions(a-c, 5)};
    }
    if(b === 2){
      kinds = ["add","sub","times","times"];
      var k2 = pick(kinds);
      if(k2 === "add"){ a = ri(10, 50 + level*5); c = ri(5, 40); return {q:a+" + "+c, prompt:"What is…", a:a+c, opts:numberOptions(a+c, 8)}; }
      if(k2 === "sub"){ a = ri(20, 60 + level*5); c = ri(5, a-1); return {q:a+" − "+c, prompt:"What is…", a:a-c, opts:numberOptions(a-c, 8)}; }
      a = ri(2, Math.min(4 + level, 10)); c = ri(2, 10);
      return {q: a + " × " + c, prompt:"What is…", a:a*c, opts:numberOptions(a*c, 9)};
    }
    /* P4, P5 and P6 each get their own syllabus, not just bigger tables. */
    if(isSenior()) return seniorQuestion(rank());
    if(rank() === 6) return p4Question();

    kinds = ["times","divide","missing","half"];
    var k3 = pick(kinds);
    if(k3 === "times"){ a = ri(3, 12); c = ri(3, 12); return {q:a+" × "+c, prompt:"What is…", a:a*c, opts:numberOptions(a*c, 12)}; }
    if(k3 === "divide"){ c = ri(2, 12); ans = ri(2, 12); a = c * ans; return {q:a+" ÷ "+c, prompt:"What is…", a:ans, opts:numberOptions(ans, 5)}; }
    if(k3 === "missing"){
      a = ri(4, 30); c = ri(2, 25);
      return {q: a + " + ? = " + (a + c), prompt:"What is missing?", a:c, opts:numberOptions(c, 7)};
    }
    ans = ri(4, 40); a = ans * 2;
    return {q:"Half of " + a, prompt:"What is…", a:ans, opts:numberOptions(ans, 6)};
  }

  /* P5 and P6 maths, straight off the MOE syllabus: fractions of a set,
     percentage, average and rate at P5; ratio, speed, volume, algebra and
     circles at P6. The wrong answers are the mistakes children actually make
     — forgetting to convert minutes, halving instead of doubling, using the
     diameter where the radius belongs — so guessing does not pay. */

  /* P4: factors and multiples, equivalent fractions, decimals to two places,
     and multiplying by tens — the year the syllabus leaves whole-number tables
     behind. P3 keeps the tables, which is where they belong. */
  function p4Question(){
    var ans, k = pick(["factor", "multiple", "equivFrac", "decimalPlace", "byTen", "bigAdd"]);

    if(k === "factor"){
      var n = pick([12, 16, 18, 20, 24, 28, 30, 36, 40, 48]);
      var facs = [], i;
      for(i = 2; i < n; i++) if(n % i === 0) facs.push(i);
      ans = pick(facs);
      var notFacs = [];
      for(i = 2; i < n && notFacs.length < 6; i++) if(n % i !== 0) notFacs.push(i);
      return {q: "Which one is a factor of " + n + "?", prompt:"Factors", a:ans,
        opts: fourOpts(ans, shuffle(notFacs))};
    }
    if(k === "multiple"){
      var base = pick([3, 4, 6, 7, 8, 9, 11, 12]);
      ans = base * ri(4, 12);
      return {q: "Which one is a multiple of " + base + "?", prompt:"Multiples", a:ans,
        opts: fourOpts(ans, [ans + 1, ans - 1, ans + 2, ans + base - 1])};
    }
    if(k === "equivFrac"){
      var den = pick([2, 3, 4, 5, 6]), num = ri(1, den - 1), mult = ri(2, 5);
      ans = num * mult;
      return {q: num + "/" + den + " = ? / " + (den * mult), prompt:"Equivalent fractions", a:ans,
        opts: fourOpts(ans, [num, num + mult, den * mult - ans, ans + 1])};
    }
    if(k === "decimalPlace"){
      var whole = ri(1, 40), hund = ri(10, 99);
      var val = Number(whole + "." + hund);
      ans = Number(String(hund).charAt(0));
      return {q: "In " + val + ", what digit is in the tenths place?", prompt:"Decimals", a:ans,
        opts: fourOpts(ans, [Number(String(hund).charAt(1)), whole % 10, ans + 1, ans - 1])};
    }
    if(k === "byTen"){
      var m = ri(12, 99), by = pick([10, 100, 1000]);
      ans = m * by;
      return {q: m + " × " + by, prompt:"What is…", a:ans,
        opts: fourOpts(ans, [m * by * 10, Math.round(m * by / 10), ans + by, m + by])};
    }
    var a4 = ri(1200, 8900), b4 = ri(500, 3900);
    ans = a4 + b4;
    return {q: a4 + " + " + b4, prompt:"What is…", a:ans,
      opts: fourOpts(ans, [a4 - b4, ans + 100, ans - 10, ans + 1000])};
  }

  /* Four options, the answer always among them, never a duplicate. Distractors
     are tried in order; if a set is too small (small numbers collide) it is
     topped up with near misses. */
  function fourOpts(ans, wrongs){
    var out = [ans], i, w;
    for(i = 0; i < wrongs.length && out.length < 4; i++){
      w = wrongs[i];
      if(w == null || !isFinite(w) || w < 0) continue;
      if(out.indexOf(w) < 0) out.push(w);
    }
    var bump = 1;
    while(out.length < 4){
      var alt = Math.round((ans + bump) * 100) / 100;
      if(alt > 0 && out.indexOf(alt) < 0) out.push(alt);
      bump = bump > 0 ? -bump : -bump + 1;
      if(bump > 40) break;
    }
    return shuffle(out);
  }

  function seniorQuestion(r){
    var a, c, ans, kinds, k;

    if(r === 7){ // P5
      kinds = ["percentOf", "fractionOf", "average", "decimal", "rate", "areaTri"];
      k = pick(kinds);

      if(k === "percentOf"){
        var pc = pick([10, 20, 25, 50, 75, 5]);
        var whole = pick([40, 60, 80, 120, 200, 240, 300, 400]);
        ans = whole * pc / 100;
        return {q: pc + "% of " + whole, prompt:"What is…", a:ans,
          opts: fourOpts(ans, [whole - ans, Math.round(ans / 10), Math.round(ans * 2), whole])};
      }
      if(k === "fractionOf"){
        var den = pick([2,3,4,5,6,8]);
        var num = ri(1, den - 1);
        var set = den * ri(3, 12);
        ans = set / den * num;
        return {q: num + "/" + den + " of " + set, prompt:"What is…", a:ans,
          opts: fourOpts(ans, [set / den, set - ans, ans + set / den, set])};
      }
      if(k === "average"){
        var n = pick([3,4,5]);
        var vals = [], total = 0, j;
        for(j = 0; j < n; j++){ var v = ri(4, 40); vals.push(v); total += v; }
        /* Nudge the last one so the mean comes out whole. */
        var rem = total % n;
        if(rem){ vals[n-1] += (n - rem); total += (n - rem); }
        ans = total / n;
        return {q: "Average of " + vals.join(", "), prompt:"What is…", a:ans,
          opts: fourOpts(ans, [total, Math.round(total / (n + 1)), ans + n, ans - n])};
      }
      if(k === "decimal"){
        var x = ri(15, 480) / 10, y = ri(12, 250) / 10;
        ans = Math.round((x + y) * 10) / 10;
        return {q: x + " + " + y, prompt:"What is…", a:ans,
          opts: fourOpts(ans, [Math.round((x - y) * 10) / 10, Math.round((ans + 0.9) * 10) / 10,
            Math.round((ans + 1) * 10) / 10, Math.round((ans - 0.1) * 10) / 10])};
      }
      if(k === "rate"){
        var per = ri(3, 12), units = ri(4, 12);
        ans = per * units;
        return {q: units + " books cost $" + ans + ". One book?", prompt:"What is…", a:per,
          opts: fourOpts(per, [ans, units, per + units, Math.round(ans / 2)])};
      }
      var base = pick([6,8,10,12,14,16,20]), h = pick([5,7,9,10,12,15]);
      ans = base * h / 2;
      return {q: "Triangle: base " + base + " cm, height " + h + " cm. Area?", prompt:"In cm²…", a:ans,
        opts: fourOpts(ans, [base * h, ans / 2, base + h, ans + base])};
    }

    // P6
    kinds = ["ratio", "speed", "volume", "algebra", "percentChange", "circle"];
    k = pick(kinds);

    if(k === "ratio"){
      var p1 = ri(1, 5), p2 = ri(1, 5);
      if(p1 === p2) p2 = p1 + 1;
      var unit = ri(3, 14), total2 = (p1 + p2) * unit;
      ans = p1 * unit;
      return {q: "Share $" + total2 + " in the ratio " + p1 + " : " + p2 + ". Bigger share?",
        prompt:"What is…", a: Math.max(p1, p2) * unit,
        opts: fourOpts(Math.max(p1,p2) * unit, [Math.min(p1,p2) * unit, total2 / 2, unit, total2])};
    }
    if(k === "speed"){
      var spd = pick([40, 50, 60, 72, 80, 90]);
      var hrs = pick([2, 3, 4, 1.5, 2.5]);
      ans = spd * hrs;
      return {q: "A car goes " + spd + " km/h for " + hrs + " h. Distance?", prompt:"In km…", a:ans,
        opts: fourOpts(ans, [Math.round(spd / hrs), spd + hrs, Math.round(ans / 2), spd * (hrs + 1)])};
    }
    if(k === "volume"){
      var L = ri(3, 12), W = ri(2, 10), H = ri(2, 9);
      ans = L * W * H;
      return {q: "Cuboid " + L + " × " + W + " × " + H + " cm. Volume?", prompt:"In cm³…", a:ans,
        opts: fourOpts(ans, [2 * (L*W + L*H + W*H), L + W + H, L * W, ans * 2])};
    }
    if(k === "algebra"){
      var m = ri(2, 9), xv = ri(2, 15), cst = ri(1, 20);
      ans = xv;
      /* "4x + 9 = 65. x = ?" crammed onto one line reads as a wall of
         symbols; a P6 child reads the equation, then the question. */
      return {q: m + "x + " + cst + " = " + (m * xv + cst) + ".\nx = ?", prompt:"Solve for x", a:ans,
        opts: fourOpts(xv, [m * xv + cst, Math.round((m * xv + cst) / m), xv + m, cst])};
    }
    if(k === "percentChange"){
      var start = pick([80, 120, 150, 200, 250, 400]);
      var up = pick([10, 20, 25, 50]);
      ans = start + start * up / 100;
      return {q: "$" + start + " increased by " + up + "%", prompt:"What is…", a:ans,
        opts: fourOpts(ans, [start * up / 100, start - start * up / 100, start + up, start])};
    }
    var rad = pick([3,4,5,6,7,10]);
    ans = Math.round(2 * 3.14 * rad * 100) / 100;
    return {q: "Circle, radius " + rad + " cm. Circumference? (π = 3.14)", prompt:"In cm…", a:ans,
      opts: fourOpts(ans, [Math.round(3.14 * rad * rad * 100) / 100,
        Math.round(3.14 * rad * 100) / 100, Math.round(4 * 3.14 * rad * 100) / 100])};
  }

  /* "4 + ? = 22" already asks the question; only a bare sum needs "= ?" put on
     the end. Every screen that shows a number question goes through here. */
  function qLine(q){
    if(!q.q) return (q.emoji || "").trim();
    return (q.q.indexOf("=") >= 0 || q.q.indexOf("?") >= 0) ? q.q : q.q + " = ?";
  }

  function renderNumbers(q, stage, done){
    stage.appendChild(el("div",{"class":"prompt", text:q.prompt || "What is…"}));
    if(q.emoji) stage.appendChild(el("div",{"class":"countrow", text:q.emoji.trim()}));
    else stage.appendChild(el("div",{"class":"bigq", text: qLine(q)}));
    stage.appendChild(choiceGrid(q.opts, q.a, done, false));
  }

  /* ---------- Letter Sounds ---------- */
  function buildSounds(level){
    var b = band(), qs = [], i;
    var pool = deal("sounds", PICS, keyer(), 8);
    for(i=0;i<8;i++){
      var right = pool[i];
      /* Older children get asked about the sound a word ends with, which is
         harder to hear than the one it starts with. */
      var useEnd = b >= 2 && (i % 2 === 1);
      var letter = useEnd ? right.w.charAt(right.w.length-1) : right.w.charAt(0);
      var others = shuffle(PICS.filter(function(x){
        var xl = useEnd ? x.w.charAt(x.w.length-1) : x.w.charAt(0);
        return xl !== letter;
      })).slice(0, b === 0 ? 2 : 3);
      qs.push({
        letter: letter,
        end: useEnd,
        word: right.w,
        answer: right.e,
        opts: shuffle([right].concat(others)).map(function(x){ return {label:x.e, value:x.e}; })
      });
    }
    return qs;
  }
  function renderSounds(q, stage, done){
    stage.appendChild(el("div",{"class":"prompt", text: q.end ? "Which one ENDS with…" : "Which one starts with…"}));

    /* The letter is spoken as well as shown — the whole point of the game is
       the sound, and a child who cannot yet read the letter had nothing to go
       on before. It says it once on arrival and again on every tap. */
    var letter = q.letter.toUpperCase();
    var row = el("div",{"class":"sayrow"});
    row.appendChild(el("div",{"class":"bigq", text: letter + " " + q.letter}));
    var say = sayButton(letter);
    if(say) row.appendChild(say);
    stage.appendChild(row);
    if(say) stage.appendChild(el("div",{"class":"sayhint", text:"Tap the speaker to hear it again"}));
    speak(letter);

    stage.appendChild(choiceGrid(q.opts, q.answer, function(ok){
      /* Saying the word after a right answer is where the sound and the
         picture join up: "B… ball". */
      if(ok && q.word) setTimeout(function(){ speak(q.word); }, 260);
      done(ok);
    }, true));
  }

  /* ---------- Word Builder ---------- */
  function startSpell(world){
    var level = levelOf(world.id), b = band();
    var maxLen = b === 0 ? 3 : b === 1 ? (level <= 4 ? 3 : 4) : b === 2 ? (level <= 4 ? 4 : 5) : 9;
    var minLen = b >= 3 ? 5 : b === 2 ? 4 : 3;
    var pool = SPELL.filter(function(x){ return x.w.length <= maxLen && x.w.length >= Math.min(minLen, maxLen); });
    if(pool.length < 6) pool = SPELL.filter(function(x){ return x.w.length <= maxLen; });
    if(pool.length < 6) pool = SPELL;
    var words = deal(world.id + ":" + maxLen, pool, keyer(), 6);
    var shell = gameShell(world, words.length);
    var i = 0, correct = 0;

    function next(){
      if(i >= words.length){ finish(world, correct, words.length); return; }
      var item = words[i];
      var target = item.w.toUpperCase();
      var placed = 0, done = false;

      shell.stage.textContent = "";
      var erow = el("div",{"class":"sayrow"});
      erow.appendChild(el("div",{"class":"bigemo", text:item.e}));
      /* A picture of a fox does not tell you it is spelt F-O-X unless you know
         the word is "fox". Now it says so. */
      var say = sayButton(item.w);
      if(say) erow.appendChild(say);
      shell.stage.appendChild(erow);
      shell.stage.appendChild(el("div",{"class":"prompt", text:"Tap the letters in order"}));
      speak(item.w);

      var slots = el("div",{"class":"slots"}), slotEls = [], s;
      for(s=0;s<target.length;s++){
        var sl = el("div",{"class":"slot"});
        slots.appendChild(sl); slotEls.push(sl);
      }
      shell.stage.appendChild(slots);

      var extras = shuffle("ABCDEFGHIJKLMNOPRSTUVWY".split("").filter(function(c){ return target.indexOf(c) < 0; }))
                     .slice(0, Math.max(2, Math.min(3, 8 - target.length)));
      var tiles = el("div",{"class":"tiles"});
      shuffle(target.split("").concat(extras)).forEach(function(ch){
        var t = el("button",{"class":"tile", text:ch});
        t.addEventListener("click", function(){
          if(done || t.classList.contains("used") || placed >= target.length) return;
          if(ch === target.charAt(placed)){
            slotEls[placed].textContent = ch;
            slotEls[placed].classList.add("filled");
            t.classList.add("used");
            placed++;
            sfx.tap();
            if(placed === target.length){
              done = true; correct++; sfx.good(); flash("⭐");
              markDot(shell.dots, i, true);
              i++; setTimeout(next, 780);
            }
          } else {
            sfx.bad();
            t.classList.add("nope");

  /* ---------- Code Path ---------- */
  function startCode(world){
    var level = levelOf(world.id);
    var rounds = 4;
    var shell = gameShell(world, rounds);
    var round = 0, correct = 0;

    var levels = forBand(CODE_LEVELS, band());
    function draw(){
      if(round >= rounds){ finish(world, correct, rounds); return; }
      var conf = levels[Math.min(level - 1 + round, levels.length - 1)];
      var n = conf.size;
      var pos = conf.start.slice();
      var queue = [];
      var running = false;

      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"Plan the route, then press Go"}));

      var grid = el("div",{"class":"maze", style:"grid-template-columns:repeat("+n+",1fr); width:min(90vw,400px)"});
      var cells = [], r, c;
      for(r=0;r<n;r++){
        cells[r] = [];
        for(c=0;c<n;c++){
          var isWall = conf.walls.some(function(w){ return w[0]===r && w[1]===c; });
          var isGoal = conf.goal[0]===r && conf.goal[1]===c;
          var cell = el("div",{"class":"mz" + (isWall ? " wall" : "") + (isGoal ? " goal" : "")});
          grid.appendChild(cell);
          cells[r][c] = cell;
        }
      }
      function paint(){
        for(var rr=0;rr<n;rr++) for(var cc=0;cc<n;cc++){
          var goal = conf.goal[0]===rr && conf.goal[1]===cc;
          cells[rr][cc].textContent = (rr===pos[0] && cc===pos[1]) ? "🤖" : (goal ? "🎯" : "");
        }
      }
      paint();
      shell.stage.appendChild(grid);

      var qbox = el("div",{"class":"queue"});
      var ARROWS = {up:"↑", down:"↓", left:"←", right:"→"};
      function drawQueue(){
        qbox.textContent = "";
        if(!queue.length){ qbox.appendChild(el("div",{"class":"empty", text:"Your steps appear here"})); return; }
        queue.forEach(function(d){ qbox.appendChild(el("div",{"class":"q", text:ARROWS[d]})); });
      }
      drawQueue();
      shell.stage.appendChild(qbox);

      function run(){
        if(running || !queue.length) return;
        running = true;
        pos = conf.start.slice(); paint();
        var step = 0;
        var timer = setInterval(function(){
          if(step >= queue.length){
            clearInterval(timer);
            var won = pos[0]===conf.goal[0] && pos[1]===conf.goal[1];
            if(won){ correct++; sfx.good(); flash("⭐"); } else { sfx.bad(); flash("🤔"); }
            markDot(shell.dots, round, won);
            round++;
            setTimeout(draw, won ? 900 : 1250);
            return;
          }
          var d = queue[step++];
          var nr = pos[0] + (d==="down"?1:d==="up"?-1:0);
          var nc = pos[1] + (d==="right"?1:d==="left"?-1:0);
          var blocked = nr<0 || nc<0 || nr>=n || nc>=n || conf.walls.some(function(w){ return w[0]===nr && w[1]===nc; });
          if(blocked){ sfx.bad(); } else { pos = [nr,nc]; sfx.tap(); }
          paint();
        }, 380);
      }

      var keys = el("div",{"class":"pad-keys"});
      function key(label, act){
        var b = el("button",{text:label, "aria-label":act});
        b.addEventListener("click", function(){
          if(running) return;
          if(act === "clear"){ queue = []; sfx.tap(); drawQueue(); return; }
          if(queue.length >= 14) return;
          queue.push(act); sfx.tap(); drawQueue();
        });
        return b;
      }
      keys.appendChild(el("div")); keys.appendChild(key("↑","up"));    keys.appendChild(el("div"));
      keys.appendChild(key("←","left")); keys.appendChild(key("✕","clear")); keys.appendChild(key("→","right"));
      keys.appendChild(el("div")); keys.appendChild(key("↓","down"));  keys.appendChild(el("div"));
      shell.stage.appendChild(keys);

      var goBtn = el("button",{"class":"btn btn-lg btn-go", style:"min-width:200px", text:"▶  Go"});
      goBtn.addEventListener("click", run);
      shell.stage.appendChild(goBtn);
    }
    draw();
  }

  /* ---------- Clocks & Coins ---------- */
  function clockFace(hr, mn, size){
    var NS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(NS,"svg");
    svg.setAttribute("viewBox","0 0 100 100");
    svg.setAttribute("width", size); svg.setAttribute("height", size);
    function add(tag, attrs){
      var e = document.createElementNS(NS, tag), k;
      for(k in attrs) e.setAttribute(k, attrs[k]);
      svg.appendChild(e); return e;
    }
    add("circle",{cx:50,cy:50,r:45,fill:"#FFFDF6",stroke:"#14113A","stroke-width":4});
    for(var t=0;t<12;t++){
      var a = (t/12)*Math.PI*2 - Math.PI/2;
      var tx = add("text",{x:50+Math.cos(a)*34, y:50+Math.sin(a)*34+4.5, "text-anchor":"middle",
        "font-family":"Baloo 2, sans-serif","font-size":11,"font-weight":800, fill:"#14113A"});
      tx.textContent = String(t === 0 ? 12 : t);
    }
    var ha = ((hr%12) + mn/60)/12*Math.PI*2 - Math.PI/2;
    var ma = (mn/60)*Math.PI*2 - Math.PI/2;
    add("line",{x1:50,y1:50,x2:50+Math.cos(ha)*20,y2:50+Math.sin(ha)*20,stroke:"#14113A","stroke-width":6,"stroke-linecap":"round"});
    add("line",{x1:50,y1:50,x2:50+Math.cos(ma)*30,y2:50+Math.sin(ma)*30,stroke:"#FF5D8F","stroke-width":4,"stroke-linecap":"round"});
    add("circle",{cx:50,cy:50,r:3.5,fill:"#14113A"});
    return svg;
  }
  function money(cents){
    return cents >= 100
      ? "$" + (cents/100).toFixed(2)
      : cents + "c";
  }
  function startMoney(world){
    var b = band(), rounds = 6;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      shell.stage.textContent = "";
      var isClock = i % 2 === 0;

      if(isClock){
        var mins = b <= 2 ? [0,30] : [0,15,30,45];
        var hr = ri(1,12), mn = pick(mins);
        shell.stage.appendChild(el("div",{"class":"prompt", text:"What time is it?"}));
        var face = el("div");
        face.appendChild(clockFace(hr, mn, Math.min(220, Math.round(window.innerWidth * 0.5))));
        shell.stage.appendChild(face);

        function label(h, m){
          var hh = h === 0 ? 12 : h;
          return m === 0 ? hh + " o'clock"
               : m === 30 ? "half past " + hh
               : m === 15 ? "quarter past " + hh
               : "quarter to " + (hh === 12 ? 1 : hh + 1);
        }
        var right = mn === 45 ? label(hr === 12 ? 11 : hr - 1 < 1 ? 12 : hr, 45) : label(hr, mn);
        if(mn === 45) right = "quarter to " + (hr === 12 ? 1 : hr + 1);
        var wrongs = [], guard = 0;
        while(wrongs.length < 3 && guard++ < 50){
          var w = label(ri(1,12), pick(mins));
          if(w !== right && wrongs.indexOf(w) < 0) wrongs.push(w);
        }
        shell.stage.appendChild(choiceGrid(shuffle([right].concat(wrongs)).map(function(t){
          return {label:t, value:t};
        }), right, function(ok){
          if(ok){ correct++; rightAnswer(); flash("⭐"); } else { wrongAnswer(); }
          markDot(shell.dots, i, ok);
          i++; setTimeout(next, ok ? 640 : 1100);
        }, false));
        var last = shell.stage.lastChild;
        Array.prototype.forEach.call(last.children, function(c){ c.style.fontSize = "clamp(16px,4vw,22px)"; c.style.minHeight = "72px"; });
      } else {
        var howMany = b <= 2 ? ri(2,3) : ri(3,5);
        var purse = [], total = 0, k;
        for(k=0;k<howMany;k++){

        shell.stage.appendChild(row);

        var opts = [total], guard2 = 0;
        while(opts.length < 4 && guard2++ < 60){
          var d = total + pick([5,10,-5,-10,20,-20,50]);
          if(d > 0 && opts.indexOf(d) < 0) opts.push(d);
        }
        while(opts.length < 4) opts.push(total + opts.length * 5);
        shell.stage.appendChild(choiceGrid(shuffle(opts).map(function(v){
          return {label: money(v), value: money(v)};
        }), money(total), function(ok){
          if(ok){ correct++; rightAnswer(); flash("⭐"); } else { wrongAnswer(); }
          markDot(shell.dots, i, ok);
          i++; setTimeout(next, ok ? 640 : 1100);
        }, false));
      }
    }
    next();
