  /* ---------- 词语 Make a Word ---------- */
  /* Two characters, one word. The child sees the picture and the first half,
     and picks the character that completes it. */
  function startZhWords(world){
    var pool = forBand(ZH_WORDS, band()), rounds = 8;
    var shell = gameShell(world, rounds);
    var i = 0, correct = 0;
    var order = dealBand(world.id, ZH_WORDS, rounds);
    var allSecond = ZH_WORDS.map(function(x){ return x.z; });

    function next(){
      if(i >= rounds){ finish(world, correct, rounds); return; }
      var right = order[i];
      var wrongs = shuffle(allSecond.filter(function(z){ return z !== right.z; }));
      var seen = {}, opts = [];
      wrongs.forEach(function(z){ if(!seen[z] && opts.length < 3){ seen[z] = 1; opts.push(z); } });

      shell.stage.textContent = "";
      shell.stage.appendChild(el("div",{"class":"prompt", text:"Finish the word"}));
      shell.stage.appendChild(el("div",{"class":"bigq", text:right.e}));
      shell.stage.appendChild(el("div",{"class":"zh-build"},
        el("span",{"class":"zh-slot", text:right.a}),
        el("span",{"class":"zh-slot blank", text:"？"})));
      shell.stage.appendChild(el("div",{"class":"zh-pinyin", text:right.p + "  —  " + right.m}));
      shell.stage.appendChild(choiceGrid(
        shuffle([right.z].concat(opts)).map(function(z){ return {label:z, value:z}; }),
        right.z, function(ok){
          if(ok){ correct++; rightAnswer(); flash("⭐"); } else { wrongAnswer(); }
          markDot(shell.dots, i, ok);
          /* Right or wrong, the whole word is read out — that is the bit
             worth remembering. */
          setTimeout(function(){ speak(right.w, {lang:"zh-CN", rate:0.72}); }, 240);
          if(!ok) shell.stage.appendChild(el("div",{"class":"zh-tell", text: right.w + "  " + right.p}));
          i++;
          setTimeout(next, ok ? 620 : 1400);
        }, false, true));
    }
    next();
  }

  /* ==========================================================================
     Two-player games

     These are the only games in here without a right answer that belongs to
     one child. Two children share one iPad: the head-to-head pair put the
     tablet flat on the table and turn the far player's half upside down, and
     the take-turns pair are read the right way up by both.

     Questions come from the same banks and the same school level as the solo
     games, so a P3 child playing a P3 parent gets P3 sums. Nothing here is
     scored against the child's own stars — a duel is for fun, and losing to
     a big sister should never cost anybody a level.
     ========================================================================== */

  function duoNames(){
    var mine = (state.name || "Player 1").slice(0, 12);
    return [mine, "Player 2"];
  }

  /* The shell both duel games share: two coloured halves facing each other,
     a thin score strip between them, and a way back to the games. */
  function duoShell(world, target){
    var names = duoNames();
    var wrap = el("div",{style:"flex:1; min-height:0; display:flex; flex-direction:column"});
    var bar = el("div",{"class":"gamebar"});
    var back = el("button",{"class":"iconbtn","aria-label":"Back to the games", text:"←"});
    back.addEventListener("click", function(){ sfx.tap(); renderHome(); });
    bar.appendChild(back);
    bar.appendChild(el("div",{"class":"dots"}));
    bar.appendChild(el("div",{"class":"tally"}, world.emo, el("b",{text:"First to " + target})));
    wrap.appendChild(bar);

    var duo = el("div",{"class":"duo"});
    var top = el("div",{"class":"duo-half duo-b flip"});
    var mid = el("div",{"class":"duo-mid"});
    var bottom = el("div",{"class":"duo-half duo-a"});
    duo.appendChild(top); duo.appendChild(mid); duo.appendChild(bottom);
    wrap.appendChild(duo);
    show(wrap);
    return {top:top, bottom:bottom, mid:mid, names:names};
  }

  /* Halves are filled the same way for both players, so one function does it. */
  function duoRound(half, name, question, onAnswer){
    half.textContent = "";
    half.classList.remove("dim");
    half.appendChild(el("div",{"class":"duo-name", text:name}));
    half.appendChild(el("div",{"class":"duo-q", text:question.q}));
    var opts = el("div",{"class":"duo-opts"});
    var used = false;
    question.opts.forEach(function(o){
      var label = String(o && o.label != null ? o.label : o);
      var value = String(o && o.value != null ? o.value : o);
      var b = el("button",{"class":"duo-opt", text:label});
      b.addEventListener("click", function(){
        if(used) return;
        var ok = value === String(question.a);
        if(ok){
          used = true;
          b.classList.add("right");
        } else {
          /* A wrong tap costs you the round rather than ending the game —
             tapping wildly should not be the winning strategy. */
          b.classList.add("wrong");
          b.disabled = true;
        }
        onAnswer(ok, b);
      });
      opts.appendChild(b);
    });
    half.appendChild(opts);
    return {lock:function(){ used = true; }};
  }

  function duoScore(mid, names, a, b, note){
    mid.textContent = "";
    mid.appendChild(el("span",{}, names[1] + " ", el("b",{text:String(b)})));
    mid.appendChild(el("span",{"class":"duo-banner", text: note || "⚔️"}));
    mid.appendChild(el("span",{}, names[0] + " ", el("b",{text:String(a)})));
  }

  function duoFinish(world, names, a, b){
    music.stop();
    sfx.win();
    var winner = a === b ? null : (a > b ? names[0] : names[1]);
    var wrap = el("div",{"class":"result"});
    wrap.appendChild(el("div",{"class":"stars-big", text: winner ? "🏆" : "🤝"}));
    wrap.appendChild(el("div",{"class":"score display", text: winner ? winner + " wins!" : "It's a draw!"}));
    wrap.appendChild(el("div",{"class":"score display", style:"font-size:22px",
      text: names[0] + " " + a + "  ·  " + names[1] + " " + b}));
    wrap.appendChild(el("div",{style:"font-weight:800; color:#C9C4EE; font-size:16px",
      text: winner ? "Good game, both of you. Best of three?" : "Dead level — you will have to play again."}));
    var again = el("button",{"class":"btn btn-lg btn-go", style:"min-width:240px", text:"Play again"});
    again.addEventListener("click", function(){ sfx.tap(); startGame(world); });
    var home = el("button",{"class":"btn btn-lg btn-ghost", style:"min-width:240px", text:"Choose another game"});
    home.addEventListener("click", function(){ sfx.tap(); renderHome(); });
    wrap.appendChild(again); wrap.appendChild(home);
    show(wrap);
  }

  /* ---------- the duel engine, shared by Maths Duel and Word Duel ---------- */
  function runDuel(world, target, makeQuestion){
    var shell = duoShell(world, target);
    var a = 0, b = 0, over = false;

    function round(){
      if(over) return;
      var q = makeQuestion();
      var claimed = false;
      duoScore(shell.mid, shell.names, a, b, "Ready…");
      setTimeout(function(){ if(!over) duoScore(shell.mid, shell.names, a, b, "GO!"); }, 450);

      function settle(who, ok){
        if(!ok){ sfx.bad(); return; }
        if(claimed) return;
        claimed = true;
        sfx.good(); flash("⭐");
        if(who === 0){ a++; } else { b++; }
        var name = shell.names[who];
        duoScore(shell.mid, shell.names, a, b, name + " gets it!");
        shell.top.classList.toggle("dim", who === 0);
        shell.bottom.classList.toggle("dim", who === 1);
        bottomCtl.lock(); topCtl.lock();
        setTimeout(function(){
          if(a >= target || b >= target){ over = true; duoFinish(world, shell.names, a, b); }
          else round();
        }, 1000);
      }

      var bottomCtl = duoRound(shell.bottom, shell.names[0], q, function(ok){ settle(0, ok); });
      var topCtl    = duoRound(shell.top,    shell.names[1], q, function(ok){ settle(1, ok); });
    }
    round();
  }

  /* ---------- Maths Duel ---------- */
  function startDuoMaths(world){
    var b = band(), level = Math.max(1, levelOf("numbers"));
    runDuel(world, 5, function(){
      var q = numberQuestion(b, level);
      /* numberQuestion can hand back a counting picture instead of a sum, and
         the missing-number kind already carries its own "=". A duel needs one
         short line both children can read at a glance, with no second "= ?"
         stuck on the end of one that has one already. */
      return {q: qLine(q), a:q.a, opts:q.opts};
    });
  }

  /* ---------- Word Duel ---------- */
  function startDuoWord(world){
    var b = band();
    runDuel(world, 5, function(){
      /* Youngest: which picture starts with this letter. Older: rhymes, then
         the odd word out — the same skills as the solo English games. */
      if(b === 0 || (b === 1 && Math.random() < .5)){
        var right = pick(PICS);
        var letter = right.w.charAt(0);
        var others = shuffle(PICS.filter(function(x){ return x.w.charAt(0) !== letter; })).slice(0,3);
        return {q:"Starts with " + letter.toUpperCase() + "?", a:right.e,
          opts:shuffle([right].concat(others)).map(function(x){ return {label:x.e, value:x.e}; })};
      }
      if(Math.random() < .5){
        var fam = pick(RHYMES);
        var seed = pick(fam);
        var mate = pick(fam.filter(function(x){ return x.w !== seed.w; })) || fam[0];
        var pool = [];
        RHYMES.forEach(function(f){ if(f !== fam) pool = pool.concat(f); });
        var wrong = shuffle(pool).slice(0,3);
        return {q:"Rhymes with " + seed.w + "?", a:mate.w,
          opts:shuffle([mate].concat(wrong)).map(function(x){ return {label:x.w, value:x.w}; })};
      }
      var set = pick(forBand(ODD, b));
      var oddItem = set.items[set.odd];
      return {q:"Which does not belong?", a:oddItem,
        opts:set.items.map(function(x){ return {label:x, value:x}; })};
    });
  }

  /* ---------- Claim the Square ---------- */
  /* Noughts and crosses, except a square is only yours once you have answered
     a question at your level. It keeps the board honest: the quicker thinker
     wins, not whoever taps first. */
  function startDuoSquares(world){
    var b = band(), level = Math.max(1, levelOf("numbers"));
    var names = duoNames();
    var marks = ["⭕","❌"];
    var cells = [null,null,null,null,null,null,null,null,null];
    var turn = 0, over = false;
    var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    var wrap = el("div",{style:"flex:1; min-height:0; display:flex; flex-direction:column"});
    var bar = el("div",{"class":"gamebar"});
    var back = el("button",{"class":"iconbtn","aria-label":"Back to the games", text:"←"});
    back.addEventListener("click", function(){ sfx.tap(); renderHome(); });
    bar.appendChild(back);
    bar.appendChild(el("div",{"class":"dots"}));
    bar.appendChild(el("div",{"class":"tally"}, world.emo, el("b",{text:"3 in a row"})));
    wrap.appendChild(bar);
    var stage = el("div",{"class":"stage"});
    wrap.appendChild(stage);
    show(wrap);

    function winner(){
      for(var i=0;i<LINES.length;i++){
        var L = LINES[i];
        if(cells[L[0]] !== null && cells[L[0]] === cells[L[1]] && cells[L[1]] === cells[L[2]]) return {who:cells[L[0]], line:L};
      }
      return null;
    }

    function board(){
      stage.textContent = "";
      var turns = el("div",{"class":"duo-turn"});
      turns.appendChild(el("div",{"class":"duo-chip ca" + (turn===0?" on":""), text: marks[0] + "  " + names[0]}));
      turns.appendChild(el("div",{"class":"duo-chip cb" + (turn===1?" on":""), text: marks[1] + "  " + names[1]}));
      stage.appendChild(turns);
      stage.appendChild(el("div",{"class":"prompt", text: names[turn] + ", pick a square"}));
      var grid = el("div",{"class":"duo-board"});
      cells.forEach(function(v, idx){
        var cls = "duo-cell" + (v === 0 ? " a" : v === 1 ? " b" : "");
        var c = el("button",{"class":cls, text: v === null ? "" : marks[v]});
        if(v === null) c.addEventListener("click", function(){ sfx.tap(); askFor(idx); });
        grid.appendChild(c);
      });
      stage.appendChild(grid);
      var done = cells.every(function(v){ return v !== null; });
      var w = winner();
      if(w || done){
        over = true;
        if(w){
          [].slice.call(grid.children).forEach(function(c, i){ if(w.line.indexOf(i) >= 0) c.classList.add("win"); });
        }
        setTimeout(function(){
          var a = w && w.who === 0 ? 1 : 0, bb = w && w.who === 1 ? 1 : 0;
          duoFinish(world, names, a, bb);
        }, 900);
      }
    }

    function askFor(idx){
      if(over) return;
      var q = numberQuestion(b, level);
      stage.textContent = "";
      stage.appendChild(el("div",{"class":"prompt", text: names[turn] + " — answer to claim it"}));
      stage.appendChild(el("div",{"class":"bigq", text: qLine(q)}));
      stage.appendChild(choiceGrid(q.opts, q.a, function(ok){
        if(ok){ cells[idx] = turn; sfx.good(); flash(marks[turn]); }
        else { sfx.bad(); }
        turn = turn === 0 ? 1 : 0;
        setTimeout(board, ok ? 650 : 1050);
      }, false));
    }

    board();
  }

  /* ---------- Memory Duel ---------- */
  /* The solo memory game, played in turns: find a pair and you go again, miss
     and it passes over. Most pairs at the end wins. */
  function startDuoMemory(world){
    var b = band();
    var names = duoNames();
    var pairs = b === 0 ? 4 : b === 1 ? 6 : 8;
    var cols = pairs <= 4 ? 4 : 4;
    var chosen = shuffle(PICS.slice()).slice(0, pairs);
    var deck = shuffle(chosen.concat(chosen));
    var open = [], busy = false, turn = 0, scores = [0,0], found = 0;

    var wrap = el("div",{style:"flex:1; min-height:0; display:flex; flex-direction:column"});
    var bar = el("div",{"class":"gamebar"});
    var back = el("button",{"class":"iconbtn","aria-label":"Back to the games", text:"←"});
    back.addEventListener("click", function(){ sfx.tap(); renderHome(); });
    bar.appendChild(back);
    bar.appendChild(el("div",{"class":"dots"}));
    bar.appendChild(el("div",{"class":"tally"}, world.emo, el("b",{text: pairs + " pairs"})));
    wrap.appendChild(bar);
    var stage = el("div",{"class":"stage"});
    wrap.appendChild(stage);

    var turns = el("div",{"class":"duo-turn"});
    function drawTurns(){
      turns.textContent = "";
      turns.appendChild(el("div",{"class":"duo-chip ca" + (turn===0?" on":""), text: names[0] + "  " + scores[0]}));
      turns.appendChild(el("div",{"class":"duo-chip cb" + (turn===1?" on":""), text: names[1] + "  " + scores[1]}));
    }
    drawTurns();
    stage.appendChild(turns);
    var says = el("div",{"class":"prompt", text: names[0] + "'s turn — find a pair"});
    stage.appendChild(says);

    var grid = el("div",{"class":"memgrid", style:"grid-template-columns:repeat("+cols+",1fr)"});
    deck.forEach(function(c){
      var card = el("button",{"class":"card", text:"?"});
      card.setAttribute("data-e", c.e);
      card.addEventListener("click", function(){
        if(busy || card.classList.contains("done") || card.classList.contains("up")) return;
        card.classList.add("up"); card.textContent = c.e; sfx.tap();
        open.push(card);
        if(open.length < 2) return;
        busy = true;
        var same = open[0].getAttribute("data-e") === open[1].getAttribute("data-e");
        setTimeout(function(){
          if(same){
            open.forEach(function(o){ o.classList.remove("up"); o.classList.add("done"); });
            scores[turn]++; found++;
            sfx.good(); flash("⭐");
            says.textContent = names[turn] + " found a pair — go again!";
          } else {
            open.forEach(function(o){ o.classList.remove("up"); o.textContent = "?"; });
            sfx.bad();
            turn = turn === 0 ? 1 : 0;
            says.textContent = names[turn] + "'s turn — find a pair";
          }
          open = []; busy = false;
          drawTurns();
          if(found >= pairs) setTimeout(function(){ duoFinish(world, names, scores[0], scores[1]); }, 700);
        }, same ? 420 : 900);
      });
      grid.appendChild(card);
    });
    stage.appendChild(grid);
    show(wrap);
  }

  /* ---------- modals ---------- */

    /* Two switches a grown-up may want on a long car journey or in a quiet

    var sf = el("div",{"class":"field"});
    sf.appendChild(el("label",{text:"Sound and movement"}));

  function api(path, body, method){
    var opts = method === "GET"
      ? {method:"GET"}
      : {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(body)};
    return fetch(API + path, opts).then(function(r){
      return r.json().then(
        function(j){ return {status:r.status, body:j}; },
        function(){ return {status:r.status, body:{}}; }
      );
    });
  }
  function applyLicence(lic, exp){
    licence = {id:lic.id, name:lic.name, trial:!!lic.trial};
    licenceExp = exp || null;
  }

  /* There is no key to buy or type any more: full access is switched on for

  /* ---------- write your own sentence ----------
     A child types one sentence. It goes to the server as 'pending' and sits
     there until a parent looks at it in the admin page; only once it is
     approved does anyone else ever see it, credited to whoever wrote it, as
     a one-round Sentence Builder made from their own words. Nothing here
     shows a child's sentence to another family before a parent has read it. */
  var WRITING_COLOURS = ["#20143A","#E8563C","#FFC43D","#57C08A","#4AA8E8","#9B7BFF","#FF5D8F","#ffffff"];

  function openWriting(){

      sw.addEventListener("click", function(){

    /* A plain 2D canvas, drawn on with Pointer Events so a finger, a mouse
       and a stylus all work the same way. touch-action:none stops the page
       itself scrolling while a child is mid-stroke. */
    var ctx2d = canvas.getContext("2d");
    function fillWhite(){ ctx2d.fillStyle = "#fff"; ctx2d.fillRect(0, 0, canvas.width, canvas.height); }
    fillWhite();
    var drawing = false, lastX = 0, lastY = 0;
    function pos(e){
      var r = canvas.getBoundingClientRect();
      return {x: (e.clientX - r.left) * (canvas.width / r.width),
              y: (e.clientY - r.top) * (canvas.height / r.height)};
    }
    canvas.addEventListener("pointerdown", function(e){
      drawing = true; canvas.setPointerCapture(e.pointerId);
      var p = pos(e); lastX = p.x; lastY = p.y;
      ctx2d.fillStyle = curColour;
      ctx2d.beginPath(); ctx2d.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx2d.fill();
    });
    canvas.addEventListener("pointermove", function(e){
      if(!drawing) return;
      var p = pos(e);
      ctx2d.strokeStyle = curColour; ctx2d.lineWidth = 10;
      ctx2d.lineCap = "round"; ctx2d.lineJoin = "round";
      ctx2d.beginPath(); ctx2d.moveTo(lastX, lastY); ctx2d.lineTo(p.x, p.y); ctx2d.stroke();
      lastX = p.x; lastY = p.y;
    });
    ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
      canvas.addEventListener(ev, function(){ drawing = false; });
    });
    clearBtn.addEventListener("click", function(){ sfx.tap(); fillWhite(); });

    box.appendChild(go);

    var listWrap = el("div",{style:"margin-top:18px"});

    function statusLabel(st){

    function loadMine(){
      listWrap.textContent = "";
      api("/api/writing?token=" + encodeURIComponent(token), null, "GET").then(function(res){
        if(!(res.status === 200 && res.body.ok) || !res.body.writings.length) return;
        listWrap.appendChild(el("div",{style:"font-weight:800; color:#C9C4EE; font-size:13px; margin-bottom:8px", text:"YOUR SUBMISSIONS"}));

          listWrap.appendChild(row);
        });
      })["catch"](function(){});
    }

    go.addEventListener("click", function(){
      go.disabled = true; err.textContent = "";
      var body = {token:token, childName:state.name || ""};
      if(mode === "draw") body.imageDataUrl = canvas.toDataURL("image/jpeg", 0.72);

          err.textContent = (res.body && res.body.message) || "Couldn't send that. Try again.";
        }
      })["catch"](function(){
        err.textContent = "Couldn't reach the server. Check your connection.";
      }).then(function(){ go.disabled = false; });
    });

    var back = el("button",{"class":"btn btn-ghost", style:"width:100%; margin-top:14px", text:"Close"});
    back.addEventListener("click", function(){ m.close(); });
    box.appendChild(back);

    var m = modal(box);
    loadMine();
    setTimeout(function(){ inp.focus(); }, 80);
  }

  /* Plays one approved sentence, exactly like Sentence Builder, credited to
     whoever wrote it. w carries {id, childName, sentence}. */
  function playWriting(w){
    var words = w.sentence.split(" ");
    var wrap = el("div",{style:"flex:1; min-height:0; display:flex; flex-direction:column"});
    var bar = el("div",{"class":"gamebar"});
    var back = el("button",{"class":"iconbtn","aria-label":"Back to the games", text:"←"});
    back.addEventListener("click", function(){ sfx.tap(); renderHome(); });
    bar.appendChild(back);
    bar.appendChild(el("div",{"class":"tally"}, "✍️", el("b",{text:"by " + (w.childName || "a player")})));
    wrap.appendChild(bar);
    var stage = el("div",{"class":"stage"});
    wrap.appendChild(stage);
    show(wrap);

    var built = [], wrong = false;
    stage.appendChild(el("div",{"class":"prompt", text:"Tap the words in the right order"}));
    var line = el("div",{"class":"sentline"});
    stage.appendChild(line);
    var tray = el("div",{"class":"wordtray"});
    stage.appendChild(tray);

    function redraw(){
      line.textContent = "";
      if(!built.length) line.appendChild(el("span",{"class":"sentghost", text:"…"}));
      built.forEach(function(t){ line.appendChild(el("span",{"class":"sentword", text:t})); });
    }
    redraw();

    var jumbled = shuffle(words.slice());
    if(jumbled[0] === words[0] && words.length > 2) jumbled = shuffle(jumbled);

    function finishRound(won){
      music.stop();
      var box = el("div",{"class":"result"});
      box.appendChild(el("div",{"class":"stars-big", text: won ? "⭐" : "✍️"}));
      box.appendChild(el("div",{"class":"score display", text: won ? "You got it!" : words.join(" ")}));
      box.appendChild(el("div",{style:"font-weight:800; color:#C9C4EE; font-size:15px",
        text:"Written by " + (w.childName || "a player")}));
      var again = el("button",{"class":"btn btn-lg btn-go", style:"min-width:240px", text:"Play again"});
      again.addEventListener("click", function(){ sfx.tap(); playWriting(w); });
      var home = el("button",{"class":"btn btn-lg btn-ghost", style:"min-width:240px", text:"Choose another game"});
      home.addEventListener("click", function(){ sfx.tap(); renderHome(); });
      box.appendChild(again); box.appendChild(home);
      show(box);
    }

    jumbled.forEach(function(t){
      var chip = el("button",{"class":"wordchip", text:t});
      chip.addEventListener("click", function(){
        if(chip.disabled || wrong) return;
        if(t === words[built.length]){
          chip.disabled = true; chip.classList.add("used");
          built.push(t); redraw(); sfx.tap();
          if(built.length === words.length){
            sfx.good(); confettiBurst(60); speak(words.join(" "));
            setTimeout(function(){ finishRound(true); }, 1200);
          }
        } else {
          wrong = true;
          chip.classList.add("bad"); sfx.bad();
          line.textContent = "";
          line.appendChild(el("span",{"class":"sentword good", text: words.join(" ")}));
          setTimeout(function(){ finishRound(false); }, 1600);
        }
      });
      tray.appendChild(chip);
    });
  }

  /* Shows one approved drawing full-size, credited to whoever drew it. w
     carries {id, childName, imageDataUrl}. */
  function viewDrawing(w){
    var wrap = el("div",{style:"flex:1; min-height:0; display:flex; flex-direction:column"});
    var bar = el("div",{"class":"gamebar"});
    var back = el("button",{"class":"iconbtn","aria-label":"Back to the games", text:"←"});
    back.addEventListener("click", function(){ sfx.tap(); renderHome(); });
    bar.appendChild(back);
    bar.appendChild(el("div",{"class":"tally"}, "🎨", el("b",{text:"by " + (w.childName || "a player")})));
    wrap.appendChild(bar);
    var stage = el("div",{"class":"stage", style:"align-items:center; justify-content:flex-start; gap:16px; padding-top:18px"});
    stage.appendChild(el("div",{"class":"prompt", text:"Drawn by " + (w.childName || "a player")}));
    stage.appendChild(el("img",{src:w.imageDataUrl, alt:"A drawing by " + (w.childName || "a player"),
      style:"max-width:100%; width:520px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.35); background:#fff"}));
    var home = el("button",{"class":"btn btn-lg btn-go", style:"min-width:240px", text:"Choose another game"});
    home.addEventListener("click", function(){ sfx.tap(); renderHome(); });
    stage.appendChild(home);
    wrap.appendChild(stage);
    show(wrap);
    confettiBurst(30);
  }

  function openKey(){
    var box = el("div");
    box.appendChild(el("h2",{"class":"display", text:"Full access"}));
    box.appendChild(el("p",{text:"There's no key to enter. Full access is switched on for your account by whoever set it up — ask them, and it will be there next time you open the app."}));
    var ok = el("button",{"class":"btn btn-lg btn-pink", style:"width:100%", text:"Got it"});
    box.appendChild(ok);

    var m = modal(box);
    ok.addEventListener("click", function(){ m.close(); if(!licence) openWelcome(false); });
  }

  /* ---------- boot ---------- */
  load();
  refreshWritings();
  renderHome();

  /* Edge-swipe back: the gesture fires a popstate. We keep one spare entry
     below this page, so the swipe lands on it instead of leaving the site, and
     immediately push another one ready for the next swipe. Nothing the child
     can do with a finger closes the app. */
  /* Whether Google sign-in is available is the server's to say — it depends on
     a client ID being configured there. Asked for once, at boot. */
  var googleClientId = null, googleReady = null;
  function loadGoogle(){
    if(googleReady) return googleReady;
    googleReady = api("/api/config", null, "GET").then(function(res){
      if(!(res.status === 200 && res.body.ok && res.body.googleClientId)) return null;
      googleClientId = res.body.googleClientId;
      return new Promise(function(resolve){
        if(window.google && window.google.accounts) return resolve(googleClientId);
        var sc = document.createElement("script");
        sc.src = "https://accounts.google.com/gsi/client";
        sc.async = true; sc.defer = true;
        sc.onload = function(){ resolve(googleClientId); };
        /* Blocked script, no network, an ad blocker — the typed form is still
           there, so the sheet must not break. */
        sc.onerror = function(){ resolve(null); };
        document.head.appendChild(sc);
      });
    })["catch"](function(){ return null; });
    return googleReady;
  }

  /* A ring wherever a finger lands, on every button in the app. One listener
     on the document rather than one per button, and it skips itself when
     motion is turned off. */
  function armRipples(){
    document.addEventListener("pointerdown", function(e){
      if(state.motion === false) return;
      var t = e.target;
      while(t && t !== document.body){
        if(t.tagName === "BUTTON" || t.getAttribute && t.getAttribute("role") === "button") break;
        t = t.parentElement;
      }
      if(!t || t === document.body) return;
      var r = el("div",{"class":"ripple"});
      r.style.left = e.clientX + "px";
      r.style.top = e.clientY + "px";
      document.body.appendChild(r);
      setTimeout(function(){ if(r.parentNode) r.parentNode.removeChild(r); }, 520);
    }, {passive:true});
  }
  armRipples();
  watchStage();

  /* ---------- installing ----------
     The service worker is what makes a browser treat this as an app rather
     than a bookmark; Android then fires beforeinstallprompt, which is the only
     way to show an install button of our own. iOS has no such event — Safari
     puts it in the Share menu — so iPhone and iPad get told where to look. */
  var installEvent = null;
  if("serviceWorker" in navigator && !PREVIEW){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("/sw.js").catch(function(){});
    });
  }
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    installEvent = e;
    showInstallBar();
  });
  window.addEventListener("appinstalled", function(){
    installEvent = null;
    try{ localStorage.setItem("papercub.installed", "1"); }catch(e){}
    var bar = document.querySelector(".installbar");
    if(bar && bar.parentNode) bar.parentNode.removeChild(bar);
  });

  function standalone(){
    try{
      return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    }catch(e){ return false; }
  }
  function isiOS(){
    return /iP(hone|ad|od)/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }
  function installDismissed(){
    try{ return localStorage.getItem("papercub.noinstall") === "1"; }catch(e){ return false; }
  }

  function showInstallBar(){
    if(standalone() || installDismissed()) return;
    if(document.querySelector(".installbar")) return;
    var bar = el("div",{"class":"installbar"});
    bar.appendChild(el("div",{"class":"ib-e", text:"🦊"}));
    var mid = el("div",{"class":"ib-mid"});
    mid.appendChild(el("div",{"class":"ib-t", text:"Add Fun Game to your home screen"}));
    mid.appendChild(el("div",{"class":"ib-s", text: installEvent
      ? "It opens like an app, full screen, and works without wifi."
      : "Tap Share, then \u201cAdd to Home Screen\u201d."}));
    bar.appendChild(mid);
    if(installEvent){
      var go = el("button",{"class":"btn btn-go ib-go", text:"Install"});
      go.addEventListener("click", function(){
        sfx.tap();
        var e = installEvent;
        installEvent = null;
        if(!e) return;
        e.prompt();
        e.userChoice["catch"](function(){})["then"](function(){});
        if(bar.parentNode) bar.parentNode.removeChild(bar);
      });
      bar.appendChild(go);
    }
    var no = el("button",{"class":"iconbtn ib-no","aria-label":"Not now", text:"✕"});
    no.addEventListener("click", function(){
      try{ localStorage.setItem("papercub.noinstall", "1"); }catch(e){}
      if(bar.parentNode) bar.parentNode.removeChild(bar);
    });
    bar.appendChild(no);
    document.body.appendChild(bar);
  }

  /* iOS never fires beforeinstallprompt, so the hint is shown on its own once
     the child has actually played a bit — nobody installs an app they have
     not tried. */
  function maybeOfferIOSInstall(){
    if(!isiOS() || standalone() || installDismissed()) return;
    if(playedCount() < 2) return;
    setTimeout(showInstallBar, 1200);
  }

  function holdHistory(){
    try{
      history.pushState({kbw:1}, "", location.href);
      window.addEventListener("popstate", function(){
        try{ history.pushState({kbw:1}, "", location.href); }catch(e){}
      });
    }catch(e){}
  }
  holdHistory();

  if(PREVIEW){
    applyLicence({id:"preview", name:"Preview", trial:false}, null);
    renderHome();
    if(!state.setup) openProfile();
  } else {
    var token = getToken();
    if(!token){
      openWelcome(false);
    } else {
      api("/api/verify", {token:token}).then(function(res){
        if(res.status === 200 && res.body.ok){
          /* The server hands back a new token when access has been widened
             since this browser last checked. */
          if(res.body.token){ setToken(res.body.token, rememberedHere()); }
          applyLicence(res.body.licence, res.body.expiresAt);
          /* Draw only once the account's stars are in, or the home screen
             would show this device's total and then quietly change. */
          syncProgress(function(){
            renderHome();
            if(!state.setup) openProfile();
          });
        } else {
          clearToken();
          openWelcome(res.body && res.body.error === "expired");
        }
      })["catch"](function(){ openWelcome(false); });
    }
  }
})();
</script>
</body>
</html>
