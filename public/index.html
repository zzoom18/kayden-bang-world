<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Six learning games for children aged 3 to 12, plus printable worksheets to download as PDF.">
<meta name="theme-color" content="#282162">
<!-- Installable. Without a manifest and a service worker a browser offers
     "add a shortcut" and nothing more; with them it offers to install, and the
     app opens on its own without browser chrome around it. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fun Game">
<meta name="application-name" content="Fun Game">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<title>Fun Game</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
  :root{
    --sun:#FFC43D; --berry:#FF5D8F; --sky:#2FB6E6; --mint:#35C48F; --grape:#9B7BFF; --coral:#FF8A5B;
    /* The page used to sit at #1B1743, which read as almost black on an iPad
       held at arm's length. Lifted to a brighter indigo, with the frosted
       surfaces raised to match so cards and text keep their contrast. */
    --ink:#282162; --ink-soft:#CFC9F5;
    --good:#35C48F; --bad:#FF5D8F;
    --r-xl:34px; --r-lg:26px; --r-md:18px;
    --ease:cubic-bezier(.34,1.56,.64,1);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; overscroll-behavior:none; overscroll-behavior-x:none}
  /* A swipe in from either edge is the browser's back and forward gesture, and
     on an iPad that walks a child straight out of the app mid-game. Claiming
     the horizontal axis here, and holding a history entry below us in the
     script, means no swipe can leave the page. */
  html{touch-action:pan-y}
  body{
    margin:0; background:var(--ink); color:#fff;
    font-family:"Nunito",ui-rounded,-apple-system,system-ui,sans-serif; font-size:16px;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  /* Every control is sized for a finger, not a cursor. */
  button{font-family:inherit; color:inherit; border:none; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none}
  .display{font-family:"Baloo 2",ui-rounded,system-ui,sans-serif; font-weight:800; letter-spacing:.3px}
  :focus-visible{outline:4px solid var(--sun); outline-offset:3px}
  img{max-width:100%}
  [hidden]{display:none!important}

  .sky-bg{position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(circle at 15% 12%, rgba(155,123,255,.46), transparent 46%),
      radial-gradient(circle at 85% 8%, rgba(255,93,143,.34), transparent 44%),
      radial-gradient(circle at 80% 88%, rgba(47,182,230,.36), transparent 48%),
      radial-gradient(circle at 10% 92%, rgba(53,196,143,.32), transparent 46%);
  }

  .app{position:relative; z-index:1; height:100%; display:flex; flex-direction:column}
  .moebar{
    flex:none; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
    padding:9px 16px; background:linear-gradient(90deg, rgba(255,196,61,.20), rgba(53,196,143,.20));
    border-bottom:2px solid rgba(255,255,255,.10);
    font-size:13px; font-weight:700; color:#E7E3FF; text-align:center; line-height:1.35;
  }
  .moebar strong{font-weight:800; color:#FFD98A}
  .moe-dot{font-size:15px}
  .moe-sep, .moe-sep2, .moe-range{color:var(--ink-soft)}
  .moe-new{font-weight:800; color:#9BE8C6}
  /* The syllabus/age-range segment is the credibility line; the weekly-new
     one is the reason to come back, so it survives on a narrow phone even
     when the middle segment (and its own separator) is dropped. */
  @media (max-width:430px){ .moe-sep, .moe-range{display:none} }
  .screen{flex:1; min-height:0; display:flex; flex-direction:column; overflow-y:auto; -webkit-overflow-scrolling:touch}
  .pad{padding:18px; max-width:1100px; width:100%; margin:0 auto}

  /* ---------- top bar ---------- */
  .topbar{display:flex; align-items:center; gap:12px; padding:14px 18px; flex-wrap:wrap}
  .avatar{
    width:52px; height:52px; border-radius:18px; flex:none; display:grid; place-items:center; font-size:28px;
    background:linear-gradient(145deg,var(--sun),var(--coral)); box-shadow:0 4px 0 rgba(0,0,0,.25);
  }
  .who{margin-right:auto; min-width:0}
  .who .hi{font-size:12px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-soft)}
  .who .nm{font-size:19px; line-height:1.1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .tally{display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.10); border-radius:999px; padding:9px 15px; font-weight:800; font-size:16px}
  .tally b{font-family:"Baloo 2",sans-serif; font-size:19px}

  /* ---------- buttons ---------- */
  .btn{
    border-radius:var(--r-md); padding:15px 22px; font-size:17px; font-weight:800;
    background:rgba(255,255,255,.14); color:#fff; min-height:56px;
    transition:transform .14s var(--ease), background .14s ease, box-shadow .14s ease;
  }
  .btn:active{transform:scale(.95)}
  .btn-lg{font-size:20px; padding:18px 30px; min-height:66px; border-radius:var(--r-lg)}
  .btn-go{background:linear-gradient(140deg,var(--mint),#5FE0AE); color:#063B2A; box-shadow:0 5px 0 #1C9A6E}
  .btn-go:active{box-shadow:0 1px 0 #1C9A6E}
  .btn-pink{background:linear-gradient(140deg,var(--berry),#FF8AB0); color:#fff; box-shadow:0 5px 0 #D63A6E}
  .btn-pink:active{box-shadow:0 1px 0 #D63A6E}
  .btn-ghost{background:rgba(255,255,255,.12)}

  /* ---------- home: the game map ---------- */
  .section-title{font-size:15px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; color:var(--ink-soft); margin:8px 0 14px}
  .worlds{display:grid; grid-template-columns:repeat(2,1fr); gap:15px}
  @media (min-width:760px){ .worlds{grid-template-columns:repeat(3,1fr); gap:20px} }
  @media (min-width:1050px){ .worlds{grid-template-columns:repeat(4,1fr)} }
  .world{
    position:relative; border-radius:var(--r-xl); padding:20px 18px 18px; text-align:left; color:#14113A;
    min-height:170px; display:flex; flex-direction:column; gap:6px; overflow:hidden;
    box-shadow:0 8px 0 rgba(0,0,0,.22); transition:transform .18s var(--ease), box-shadow .18s ease;
  }
  .world:active{transform:translateY(4px); box-shadow:0 3px 0 rgba(0,0,0,.22)}

  /* "Next up for you": the one card a child should tap if they cannot choose. */
  .nextcard{
    width:100%; display:flex; align-items:center; gap:16px; text-align:left;
    border-radius:var(--r-lg); padding:16px 18px; margin-bottom:22px; color:#fff;
    background:linear-gradient(120deg, rgba(255,196,61,.30), rgba(155,123,255,.34));
    border:3px solid rgba(255,255,255,.22); box-shadow:0 8px 0 rgba(0,0,0,.20);
    transition:transform .18s var(--ease), box-shadow .18s ease;
  }
  .nextcard:active{transform:translateY(4px); box-shadow:0 3px 0 rgba(0,0,0,.20)}
  .nextcard.done{background:linear-gradient(120deg, rgba(53,196,143,.32), rgba(47,182,230,.30))}
  .nextcard .ne{font-size:42px; line-height:1; flex:none}
  .nextcard .nl{font-size:12px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; color:#FFD98A}
  .nextcard .nn{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:21px; line-height:1.15; margin:2px 0 3px}
  .nextcard .nw{font-size:13.5px; font-weight:700; color:#E7E3FF; line-height:1.35}
  .nextcard .go{margin-left:auto; flex:none; font-size:26px; opacity:.85}
  .world .emo{font-size:44px; line-height:1}
  .world .nm{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:20px; line-height:1.1}
  .world .sub{font-size:13.5px; font-weight:700; opacity:.74; line-height:1.3}
  .world .lvl{
    margin-top:auto; display:inline-flex; align-items:center; gap:6px; align-self:flex-start;
    background:rgba(0,0,0,.18); color:#fff; border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:800;
  }
  /* Dim the card, but keep the title readable — the child still needs to see
     which game they are asking for. */
  .world .lock{
    position:absolute; inset:0; background:rgba(20,17,58,.62);
    display:flex; align-items:flex-end; justify-content:center; padding:16px;
  }
  .world .lock span{
    display:inline-flex; align-items:center; gap:7px; background:rgba(0,0,0,.55); color:#fff;
    border-radius:999px; padding:8px 15px; font-size:12.5px; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
  }

  /* ---------- game shell ---------- */
  .gamebar{display:flex; align-items:center; gap:12px; padding:12px 16px}
  .iconbtn{width:52px; height:52px; border-radius:17px; background:rgba(255,255,255,.14); font-size:24px; display:grid; place-items:center; flex:none}
  .dots{display:flex; gap:7px; margin-right:auto; flex-wrap:wrap}
  .dot{width:13px; height:13px; border-radius:50%; background:rgba(255,255,255,.22)}
  .dot.on{background:var(--sun)} .dot.bad{background:var(--berry)}
  .stage{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:16px 18px 30px; text-align:center}
  .prompt{font-size:18px; font-weight:800; color:var(--ink-soft); letter-spacing:.4px}

  /* ---- two-player games: one iPad flat on the table, a child on each side ---- */
  .duo{flex:1; min-height:0; display:flex; flex-direction:column; gap:10px; padding:10px 12px 16px}
  .duo-half{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; border-radius:24px; padding:10px; color:#fff; text-align:center;
    position:relative; overflow:hidden}
  /* The far player reads the screen upside down, so their whole half is turned. */
  .duo-half.flip{transform:rotate(180deg)}
  .duo-a{background:linear-gradient(150deg,#FF8AB0,#FF5D8F)}
  .duo-b{background:linear-gradient(150deg,#63D6FF,#2FB6E6)}
  .duo-half.dim{opacity:.45}
  .duo-name{font-weight:800; font-size:13px; letter-spacing:.09em; text-transform:uppercase; opacity:.92}
  .duo-q{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:clamp(26px,6.5vw,46px); line-height:1.1}
  .duo-opts{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; width:min(420px,100%)}
  .duo-opt{min-height:58px; border-radius:16px; border:none; background:rgba(255,255,255,.30);
    color:#fff; font-family:inherit; font-size:23px; font-weight:800; touch-action:manipulation}
  .duo-opt:active{transform:scale(.94)}
  .duo-opt.right{background:var(--good)}
  .duo-opt.wrong{background:rgba(0,0,0,.28); opacity:.55}
  .duo-mid{display:flex; align-items:center; justify-content:center; gap:16px; flex:none;
    font-weight:800; color:var(--ink-soft); font-size:15px; letter-spacing:.04em}
  .duo-mid b{color:#fff; font-size:22px}
  .duo-banner{font-weight:800; font-size:17px}
  /* ---- shared-board two-player games: both children on the same side ---- */
  .duo-board{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:min(420px,92vw)}
  .duo-cell{aspect-ratio:1; border-radius:20px; border:none; background:rgba(255,255,255,.22);
    color:#fff; font-size:clamp(30px,9vw,52px); font-weight:800; font-family:inherit;
    touch-action:manipulation; display:grid; place-items:center}
  .duo-cell:active{transform:scale(.95)}
  .duo-cell.a{background:linear-gradient(150deg,#FF8AB0,#FF5D8F)}
  .duo-cell.b{background:linear-gradient(150deg,#63D6FF,#2FB6E6)}
  .duo-cell.win{outline:5px solid #FFC43D; outline-offset:-5px}
  .duo-turn{display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap}
  .duo-chip{padding:9px 16px; border-radius:999px; font-weight:800; font-size:15px;
    background:rgba(255,255,255,.18); color:var(--ink-soft)}
  .duo-chip.on{color:#fff}
  .duo-chip.ca.on{background:linear-gradient(150deg,#FF8AB0,#FF5D8F)}
  .duo-chip.cb.on{background:linear-gradient(150deg,#63D6FF,#2FB6E6)}
  .bigq{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:clamp(44px,10vw,84px); line-height:1.15; white-space:pre-line}
  .bigemo{font-size:clamp(70px,19vw,140px); line-height:1}
  .choices{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; width:100%; max-width:620px}
  .choices.three{grid-template-columns:repeat(3,1fr)}
  .choice{
    min-height:86px; border-radius:var(--r-lg); background:rgba(255,255,255,.26); color:#fff;
    font-family:"Baloo 2",sans-serif; font-weight:800; font-size:clamp(26px,6vw,38px);
    display:grid; place-items:center; padding:14px; transition:transform .14s var(--ease), background .16s ease;
  }
  /* ---- Number Rally ---- */
  .track-r{position:relative; width:100%; max-width:700px; border-radius:22px; padding:12px 12px 12px 0;
    background:linear-gradient(180deg,#3B3480,#2A2560); border:3px solid rgba(255,255,255,.12);
    display:flex; flex-direction:column; gap:9px}
  .lane-r{display:flex; align-items:center; gap:9px}
  .lane-name{width:64px; flex:none; text-align:right; font-size:11.5px; font-weight:800;
    color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .lane-r.mine .lane-name{color:#FFD98A}
  .lane-strip{position:relative; flex:1; height:38px; border-radius:12px;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 26px, rgba(255,255,255,0) 26px 52px),
               rgba(0,0,0,.26)}
  .lane-r.mine .lane-strip{background:repeating-linear-gradient(90deg, rgba(255,217,138,.13) 0 26px, rgba(255,255,255,0) 26px 52px), rgba(0,0,0,.3);
    box-shadow:inset 0 0 0 2px rgba(255,217,138,.3)}
  .lane-car{position:absolute; top:50%; transform:translateY(-50%); left:0; font-size:26px;
    transition:left .45s var(--ease)}
  .lane-r.mine .lane-car{font-size:30px}
  .lane-car.zoom{animation:zoomcar .45s var(--ease)}
  @keyframes zoomcar{0%,100%{filter:none} 40%{filter:drop-shadow(-10px 0 6px rgba(255,217,138,.8)) brightness(1.3)}}
  .lane-car.skid{animation:skidcar .45s ease}
  @keyframes skidcar{0%,100%{transform:translateY(-50%)} 30%{transform:translateY(-50%) rotate(-18deg)} 60%{transform:translateY(-50%) rotate(10deg)}}
  .finishline{position:absolute; right:8px; top:0; bottom:0; display:flex; align-items:center;
    font-size:26px; pointer-events:none}



  /* ---- shared: a quiet line of explanation under a board ---- */
  .hintline{max-width:520px; text-align:center; font-weight:800; font-size:14.5px;
    line-height:1.45; color:var(--ink-soft); text-wrap:balance}

  /* ---- Number Line Leap ---- */
  .numline{position:relative; width:100%; max-width:560px; height:104px; margin:6px 0 2px}
  .numline-rail{position:absolute; left:4%; right:4%; top:46px; height:8px; border-radius:6px;
    background:linear-gradient(90deg,#57C08A,#2FB6E6)}
  .numline-tick{position:absolute; top:30px; transform:translateX(-50%); width:34px; height:40px;
    padding:0; border:0; background:none; cursor:pointer; font-family:inherit;
    -webkit-tap-highlight-color:transparent}
  .numline-tick::before{content:""; display:block; margin:0 auto; width:4px; height:26px;
    border-radius:3px; background:rgba(255,255,255,.55)}
  .numline-tick:active::before{background:#FFD98A}
  .numline-tick.right::before{background:#57C08A; height:34px; margin-top:-4px}
  .numline-tick.wrong::before{background:#E8563C; height:34px; margin-top:-4px}
  .numline-lab{display:block; margin-top:3px; font-size:13px; font-weight:900; color:#fff}
  .numline-frog{position:absolute; top:0; left:50%; transform:translateX(-50%); font-size:30px;
    transition:left .4s var(--ease); pointer-events:none}
  .numline-frog.hop{animation:froghop .45s var(--ease)}
  @keyframes froghop{0%,100%{margin-top:0} 45%{margin-top:-20px}}

  /* ---- Pattern Train ---- */
  .train{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center;
    width:100%; max-width:600px; padding:12px 10px; border-radius:20px;
    background:rgba(0,0,0,.22); border:3px solid rgba(255,255,255,.1)}
  .train-loco{font-size:32px; flex:none}
  .train-car{min-width:48px; height:48px; border-radius:11px; display:grid; place-items:center;
    background:rgba(255,255,255,.2); color:#fff; font-weight:900; font-size:19px; padding:0 8px}
  .train-car.emo{font-size:27px; background:rgba(255,255,255,.14)}
  .train-car.gap{background:rgba(255,217,138,.2); border:3px dashed rgba(255,217,138,.75);
    color:#FFD98A; font-size:25px}

  /* ---- Basket Catch ---- */
  .catch-arena{position:relative; width:100%; max-width:520px; height:clamp(240px,42vh,340px);
    border-radius:22px; overflow:hidden; border:3px solid rgba(255,255,255,.12);
    background:linear-gradient(180deg,#2E2866 0%,#3E3382 58%,#5A4A2E 100%); touch-action:none}
  .catch-drop{position:absolute; top:-40px; transform:translateX(-50%); min-width:52px; padding:7px 11px;
    border-radius:13px; background:#FFD166; color:#20143A; font-weight:900; font-size:21px;
    text-align:center; box-shadow:0 3px 7px rgba(0,0,0,.32)}
  .catch-drop.caught{animation:caught .4s var(--ease) forwards}
  @keyframes caught{to{transform:translateX(-50%) scale(1.5); opacity:0}}
  .catch-basket{position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    font-size:46px; pointer-events:none; filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))}
  .catch-arrows{display:flex; gap:12px; margin-top:4px}
  .catch-arrow{min-width:92px; font-size:22px; padding:10px 0}

  /* ---- Magnet or Not ---- */
  .magnet-scene{position:relative; display:flex; align-items:center; justify-content:center;
    gap:26px; width:100%; max-width:380px; height:110px; border-radius:20px;
    background:rgba(0,0,0,.2); border:3px solid rgba(255,255,255,.1)}
  .magnet-mag{font-size:46px}
  .magnet-obj{font-size:42px; transition:transform .5s var(--ease)}
  .magnet-obj.pulled{transform:translateX(-58px) rotate(-14deg)}
  .magnet-obj.stuck{animation:magstuck .5s ease}
  @keyframes magstuck{0%,100%{transform:none} 30%{transform:translateX(-10px)} 60%{transform:translateX(4px)}}

  /* ---- Chinese characters at reading size ---- */
  .zhbig{font-size:clamp(30px,7.5vw,50px); letter-spacing:.06em}
  .zhhuge{font-size:clamp(76px,22vw,132px); line-height:1.05; font-weight:800; color:#fff;
    text-shadow:0 4px 14px rgba(0,0,0,.35)}

  /* ---- Slice the Answer ---- */
  .ninja-arena{position:relative; width:100%; max-width:560px; height:clamp(230px,42vh,340px);
    border-radius:22px; overflow:hidden; border:3px solid rgba(255,255,255,.12);
    background:linear-gradient(180deg,#2B2560 0%,#4A2A66 62%,#1C1840 100%)}
  .fruit{position:absolute; top:0; left:0; width:58px; height:58px; padding:0; border:0;
    background:none; cursor:pointer; will-change:transform; -webkit-tap-highlight-color:transparent;
    display:grid; place-items:center; font-family:inherit}
  .fruit-skin{grid-area:1/1; font-size:52px; line-height:1; filter:drop-shadow(0 3px 5px rgba(0,0,0,.4))}
  .fruit-num{grid-area:1/1; font-weight:900; font-size:21px; color:#20143A;
    text-shadow:0 1px 0 rgba(255,255,255,.75)}
  .fruit.hit{animation:fruithit .4s var(--ease) forwards}
  @keyframes fruithit{to{transform:scale(2.1); opacity:0}}
  .fruit.miss{animation:fruitmiss .4s ease}
  @keyframes fruitmiss{0%,100%{filter:none} 50%{filter:grayscale(1) brightness(.5)}}

  /* ---- Table Tower ---- */
  .tower-scene{position:relative; width:100%; max-width:420px; height:clamp(210px,34vh,320px);
    border-radius:22px; border:3px solid rgba(255,255,255,.12);
    background:linear-gradient(180deg,#8FD3F4 0%,#C8E9FF 68%,#E9F6D6 100%); overflow:hidden}
  .tower-ground{position:absolute; left:0; right:0; bottom:0; height:46px;
    background:linear-gradient(180deg,#8FBF63,#5E9440)}
  .tower-stack{position:absolute; left:50%; bottom:44px; transform:translateX(-50%);
    display:flex; flex-direction:column-reverse; align-items:center; gap:2px}
  .tower-block{width:82px; height:32px; border-radius:7px; display:grid; place-items:center;
    font-size:16px; box-shadow:inset 0 -4px 0 rgba(0,0,0,.18), 0 2px 4px rgba(0,0,0,.2);
    animation:blockdrop .34s var(--ease)}
  @keyframes blockdrop{from{transform:translateY(-70px); opacity:0} to{transform:none; opacity:1}}
  .tower-block.falling{animation:blockfall .5s ease forwards}
  @keyframes blockfall{to{transform:translate(52px,120px) rotate(58deg); opacity:0}}
  .tower-crane{position:absolute; left:50%; bottom:52px; transform:translateX(-50%);
    font-size:26px; transition:bottom .34s var(--ease); z-index:2}
  .tower-scene.wobble{animation:towerwobble .5s ease}
  @keyframes towerwobble{0%,100%{transform:none} 25%{transform:rotate(-1.6deg)} 70%{transform:rotate(1.2deg)}}

  /* ---- Measure Up, Word Problems ---- */
  .boardwrap{display:flex; justify-content:center; width:100%; margin:4px 0 2px}
  .wordprob{max-width:520px; font-weight:800; font-size:clamp(17px,3.8vw,22px); line-height:1.45;
    color:#fff; text-align:center; text-wrap:balance}

  /* ---- Maths Quest ---- */
  .questStage{gap:14px; justify-content:flex-start; padding-top:10px}
  .herogrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:11px; margin:6px 0 4px}
  .herocard{border-radius:20px; padding:15px 8px; color:#fff; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:7px;
    box-shadow:0 6px 0 rgba(0,0,0,.26); transition:transform .16s var(--ease)}
  .herocard:active{transform:translateY(4px)}
  .herocard .he{font-size:38px; line-height:1}
  .herocard .hn{font-weight:800; font-size:14px}

  .arena-q{display:flex; align-items:stretch; justify-content:center; gap:10px;
    width:100%; max-width:700px}
  .fighter{flex:1; min-width:0; position:relative; border-radius:22px; padding:13px 11px;
    display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center;
    background:rgba(255,255,255,.14); border:3px solid rgba(255,255,255,.14)}
  .fighter.boss{border-color:#FFD98A; box-shadow:0 0 0 3px rgba(255,217,138,.25)}
  .f-name{font-size:12.5px; font-weight:800; line-height:1.25; min-height:2.5em;
    display:flex; align-items:center; justify-content:center}
  .f-e{font-size:clamp(44px,12vw,66px); line-height:1; transition:transform .18s ease}
  .f-e.swing{animation:swing .4s var(--ease)}
  @keyframes swing{0%,100%{transform:none} 40%{transform:translateY(-10px) rotate(-16deg) scale(1.12)}}
  .f-e.hurt{animation:hurt .4s ease}
  @keyframes hurt{0%,100%{transform:none; filter:none}
    30%{transform:translateX(7px); filter:brightness(2) saturate(.3)}
    60%{transform:translateX(-5px)}}
  .hpbar{width:100%; height:12px; border-radius:999px; background:rgba(0,0,0,.34); overflow:hidden}
  .hpfill{height:100%; border-radius:999px; transition:width .35s var(--ease)}
  .foehp{background:linear-gradient(90deg,#FF8A5B,#FF5D8F)}
  .mehp{background:linear-gradient(90deg,#6FE0B4,#35C48F)}
  .hptxt{font-size:11.5px; font-weight:800; color:var(--ink-soft)}
  .versus{display:flex; align-items:center; font-size:22px; opacity:.6; flex:none}
  .kit{display:flex; gap:6px; margin-top:2px}
  .kitslot{width:32px; height:32px; border-radius:11px; display:grid; place-items:center;
    font-size:17px; background:rgba(0,0,0,.26)}
  .kitslot.empty{opacity:.3; font-size:13px}
  .dmg{position:absolute; top:34%; left:50%; transform:translateX(-50%);
    font-family:"Baloo 2",sans-serif; font-weight:800; font-size:26px; pointer-events:none;
    animation:dmgup .9s ease-out forwards; text-shadow:0 2px 6px rgba(0,0,0,.5)}
  .dmg.bad-dmg{color:#FFD98A}
  @keyframes dmgup{0%{opacity:0; transform:translate(-50%,6px) scale(.7)}
    25%{opacity:1; transform:translate(-50%,-10px) scale(1.15)}
    100%{opacity:0; transform:translate(-50%,-46px) scale(1)}}
  .qbox{display:flex; flex-direction:column; align-items:center; gap:14px; width:100%}
  .gearwin{display:flex; align-items:center; gap:11px; justify-content:center;
    background:linear-gradient(120deg, rgba(255,196,61,.28), rgba(155,123,255,.28));
    border:3px solid rgba(255,217,138,.4); border-radius:18px; padding:11px 15px;
    font-size:14.5px; font-weight:700; max-width:420px; line-height:1.4}
  .gw-e{font-size:28px; line-height:1; flex:none}
  /* What the fight is for: shown every level, not only on the level that
     hands it over, so a child three fights away from a new sword still
     knows it is coming. Dashed and dim, unlike .gearwin's solid gold — this
     one has not been earned yet. */
  .nextgear{display:flex; align-items:center; gap:10px; justify-content:center;
    background:rgba(255,255,255,.08); border:2.5px dashed rgba(255,255,255,.28);
    border-radius:16px; padding:9px 14px; font-size:13px; font-weight:700;
    color:var(--ink-soft); max-width:420px; line-height:1.35; text-align:left}
  .nextgear.soon{background:linear-gradient(120deg, rgba(255,196,61,.16), rgba(155,123,255,.16));
    border-color:rgba(255,217,138,.55); color:#fff}
  .ng-e{font-size:24px; line-height:1; flex:none; opacity:.85}
  .nextgear.soon .ng-e{opacity:1}

  /* ---- Harbour Cannon ---- */
  .sea{position:relative; width:100%; max-width:760px; height:clamp(280px,50vh,500px);
    border-radius:26px; overflow:hidden; touch-action:manipulation;
    background:linear-gradient(180deg,#5FB6EA 0%,#3D97D4 46%,#1F6FAE 100%);
    box-shadow:inset 0 -18px 34px rgba(11,60,100,.35), 0 10px 0 rgba(0,0,0,.20)}
  /* Sky above the horizon, water below it, so a boat looks like it is afloat. */
  .sea-sky{position:absolute; left:0; right:0; top:0; height:27%; pointer-events:none;
    background:linear-gradient(180deg,#BDE9FF 0%,#8FD6F7 78%,#7FCBEF 100%);
    border-bottom:3px solid rgba(255,255,255,.34)}
  .sea-sun{position:absolute; top:12px; right:18px; font-size:34px; opacity:.95; z-index:2}
  .sea-wave{position:absolute; left:0; right:0; bottom:0; height:44%; pointer-events:none;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.10) 0 2px, rgba(255,255,255,0) 2px 16px),
      linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,0))}
  .boat{position:absolute; left:0; z-index:3; padding:0; border:none; background:none;
    transform-origin:center; will-change:transform; touch-action:manipulation;
    filter:drop-shadow(0 6px 10px rgba(11,60,100,.4))}
  .boat:active{filter:drop-shadow(0 3px 6px rgba(11,60,100,.45)) brightness(1.1)}
  .boat.sunk{animation:none; transition:opacity .5s ease, filter .5s ease; opacity:0; filter:blur(2px)}
  .boat.bounced{animation:bounceoff .4s ease}
  @keyframes bounceoff{0%,100%{filter:none} 30%{filter:brightness(1.7) saturate(.4)} 60%{filter:none}}
  .splash{position:absolute; font-size:40px; pointer-events:none; transform:translate(-50%,-10%);
    animation:splashup .8s ease-out forwards}
  @keyframes splashup{0%{opacity:0; transform:translate(-50%,10%) scale(.5)}
    35%{opacity:1; transform:translate(-50%,-30%) scale(1.15)}
    100%{opacity:0; transform:translate(-50%,-70%) scale(.8)}}

  .gundeck{display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; width:100%}
  .gun{display:flex; align-items:center; gap:12px; padding:12px 18px; border-radius:22px;
    background:linear-gradient(140deg,#4A4290,#332C74); border:3px solid rgba(255,255,255,.18)}
  .gun-barrel{font-size:34px; line-height:1; transform:scaleX(-1)}
  .gun-shell{text-align:left; min-width:120px}
  .gs-l{font-size:11px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; color:#FFD98A}
  .gs-v{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:clamp(24px,5.5vw,34px); line-height:1.1}
  .gs-v.swap{animation:pop .4s var(--ease)}
  .reloadbtn{min-height:52px; padding:0 18px; font-size:15px}

  /* ---- English games ---- */
  .sentence{font-size:clamp(19px,4.4vw,27px); font-weight:800; line-height:1.45; max-width:620px}
  .why{font-size:15px; font-weight:800; color:#8FE3C4; max-width:560px; line-height:1.45}
  .idiom{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:clamp(24px,5.6vw,40px); line-height:1.25; max-width:620px}
  .passage{font-size:clamp(15px,3.6vw,18px); font-weight:700; line-height:1.65; max-width:620px;
    background:rgba(255,255,255,.14); border-radius:20px; padding:16px 18px; text-align:left}
  .sentline{min-height:64px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center;
    max-width:640px; padding:10px 14px; border-radius:18px; background:rgba(255,255,255,.10);
    border:3px dashed rgba(255,255,255,.20)}
  .sentghost{color:var(--ink-soft); font-weight:800; font-size:22px}
  .sentword{font-weight:800; font-size:clamp(17px,4vw,23px)}
  .sentword.good{color:#8FE3C4}
  .wordtray{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:640px}
  .wordchip{padding:14px 18px; min-height:56px; border-radius:16px; background:rgba(255,255,255,.26);
    color:#fff; font-family:inherit; font-size:clamp(16px,3.8vw,21px); font-weight:800}
  .wordchip:active{transform:scale(.94)}
  .wordchip.used{opacity:.28}
  .wordchip.bad{background:var(--bad)}
  .sentchoices{display:flex; flex-direction:column; gap:12px; width:100%; max-width:620px}
  .sentchoice{padding:16px 18px; min-height:62px; border-radius:18px; background:rgba(255,255,255,.22);
    color:#fff; font-family:inherit; font-size:clamp(15px,3.6vw,19px); font-weight:800; text-align:left;
    line-height:1.4; transition:background .16s ease, transform .14s var(--ease)}
  .sentchoice:active{transform:scale(.98)}
  .sentchoice.right{background:var(--good)}
  .sentchoice.wrong{background:var(--bad)}
  .togrow{display:flex; gap:10px; flex-wrap:wrap}
  .tog{flex:1; min-width:140px; min-height:56px; border-radius:16px; font-family:inherit;
    font-size:15px; font-weight:800; background:rgba(255,255,255,.14); color:var(--ink-soft);
    transition:background .16s ease, color .16s ease, transform .14s var(--ease)}
  .tog.on{background:linear-gradient(140deg,var(--mint),#2AA87A); color:#fff}
  .tog:active{transform:scale(.96)}
  /* ---- My progress ----
     None of this had a stylesheet, so the screen was rendering as raw markup:
     white blocks, overlapping labels, stat tiles stacked one word per line. */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:22px}
  .stat{background:rgba(255,255,255,.16); border-radius:22px; padding:16px 14px; text-align:center;
    border:2px solid rgba(255,255,255,.10)}
  .stat .se{font-size:30px; line-height:1}
  .stat .sv{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:32px; line-height:1.1; margin-top:4px}
  .stat .sl{font-size:12.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft)}

  /* "Next to unlock": the named game the next stars will open. */
  .unlocknext{display:flex; gap:16px; align-items:flex-start; margin-bottom:20px;
    border-radius:var(--r-lg); padding:16px 18px;
    background:linear-gradient(120deg, rgba(255,196,61,.24), rgba(255,93,143,.24));
    border:3px solid rgba(255,217,138,.34)}
  .unlocknext.done{background:linear-gradient(120deg, rgba(53,196,143,.26), rgba(47,182,230,.24));
    border-color:rgba(143,227,196,.4)}
  .un-e{font-size:40px; line-height:1; flex:none; filter:brightness(0) opacity(.42)}
  .unlocknext.done .un-e{filter:none}
  .un-mid{min-width:0; flex:1}
  .un-l{font-size:12px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; color:#FFD98A}
  .unlocknext.done .un-l{color:#8FE3C4}
  .un-n{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:21px; line-height:1.2; margin:2px 0 3px}
  .un-s{font-size:13.5px; font-weight:700; color:#E7E3FF; line-height:1.35}
  .un-track{height:12px; border-radius:999px; background:rgba(0,0,0,.28); overflow:hidden; margin:11px 0 7px}
  .un-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--sun),#FF8A5B);
    transition:width .6s var(--ease)}
  .un-w{font-size:13px; font-weight:800; color:#FFD98A}

  .track{height:14px; border-radius:999px; background:rgba(0,0,0,.26); overflow:hidden; margin:2px 0 8px}
  .track .fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--sun),var(--mint));
    transition:width .5s var(--ease); min-width:0}
  .trackn{font-size:13px; font-weight:800; color:var(--ink-soft); margin-bottom:14px}

  .path{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:12px; margin-bottom:26px}
  .step{border-radius:20px; padding:14px 12px; text-align:center; color:#fff; font-family:inherit;
    background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.12);
    display:flex; flex-direction:column; align-items:center; gap:5px; min-height:118px;
    transition:transform .16s var(--ease), background .16s ease}
  .step:active{transform:scale(.96)}
  .step .pe{font-size:30px; line-height:1}
  .step .pn{font-weight:800; font-size:14px; line-height:1.25}
  .step .pl{font-size:12px; font-weight:800; color:var(--ink-soft)}
  .step.done{background:linear-gradient(150deg,rgba(53,196,143,.55),rgba(42,168,122,.55)); border-color:rgba(143,227,196,.45)}
  .step.done .pe{color:#8FE3C4}
  .step.done .pl{color:#C9F4E3}
  .step.doing{background:linear-gradient(150deg,rgba(255,196,61,.42),rgba(255,158,61,.42)); border-color:rgba(255,217,138,.45)}
  .step.doing .pl{color:#FFE9BC}
  .step.todo{opacity:.82}

  .step.gatedstep{filter:saturate(.3) brightness(.8); border-style:dashed}
  .step.gatedstep .pe{filter:brightness(0) opacity(.4)}
  .step.gatedstep .pl{color:#FFD98A}

  .badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:12px; margin-bottom:8px}
  .badge{border-radius:20px; padding:14px 10px; text-align:center; background:rgba(255,255,255,.09);
    border:2px dashed rgba(255,255,255,.16); display:flex; flex-direction:column; align-items:center; gap:6px}
  .badge .be{font-size:32px; line-height:1; filter:grayscale(1) opacity(.45)}
  .badge .bn{font-size:12px; font-weight:800; color:var(--ink-soft); line-height:1.3}
  .badge.has{background:linear-gradient(150deg,rgba(255,196,61,.34),rgba(155,123,255,.34));
    border-style:solid; border-color:rgba(255,217,138,.5)}
  .badge.has .be{filter:none}
  .badge.has .bn{color:#fff}

  /* ---- star-gated games ---- */
  .world.gated{filter:saturate(.35) brightness(.72); box-shadow:0 8px 0 rgba(0,0,0,.28)}
  .world.gated .nm{letter-spacing:.22em}
  .world.gated .sub{opacity:.6}
  .hidden-emo{filter:brightness(0) opacity(.34); transform:scale(.92)}
  .gatepill{margin-top:auto; align-self:flex-start; display:inline-flex; align-items:center; gap:7px;
    background:rgba(0,0,0,.34); color:#FFD98A; border-radius:999px; padding:7px 14px;
    font-size:13px; font-weight:800}
  /* ---- install prompt ---- */
  .installbar{position:fixed; left:12px; right:12px; z-index:38; display:flex; align-items:center; gap:12px;
    bottom:calc(12px + env(safe-area-inset-bottom,0px));
    padding:13px 14px; border-radius:22px; color:#fff;
    background:linear-gradient(120deg,#4A4290,#332C74); border:3px solid rgba(255,255,255,.2);
    box-shadow:0 14px 34px rgba(0,0,0,.4); animation:rise .35s var(--ease)}
  .ib-e{font-size:32px; line-height:1; flex:none}
  .ib-mid{flex:1; min-width:0}
  .ib-t{font-weight:800; font-size:15px; line-height:1.25}
  .ib-s{font-size:12.5px; font-weight:700; color:#C9C4EE; margin-top:2px; line-height:1.3}
  .ib-go{flex:none; min-height:48px; padding:0 18px; font-size:15px}
  .ib-no{flex:none; width:40px; height:40px; font-size:16px}
  @media (max-width:460px){ .installbar{flex-wrap:wrap} .ib-go{width:100%} }
  /* ---- celebration ---- */
  .spark{position:fixed; z-index:36; pointer-events:none; font-size:26px; will-change:transform,opacity;
    animation:sparkfly .95s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes sparkfly{
    0%{transform:translate(-50%,-50%) scale(.4); opacity:0}
    20%{opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.15) rotate(40deg); opacity:0}
  }
  /* The fox reacts, so the child is not the only one in the room. */
  .avatar.cheer{animation:cheer .7s var(--ease)}
  @keyframes cheer{0%,100%{transform:none} 30%{transform:translateY(-12px) scale(1.12) rotate(-8deg)} 60%{transform:translateY(0) scale(1.04) rotate(6deg)}}
  .avatar.oops{animation:oops .5s ease}
  @keyframes oops{0%,100%{transform:none} 25%{transform:rotate(-9deg)} 50%{transform:rotate(8deg)} 75%{transform:rotate(-5deg)}}
  /* A ring that expands from wherever a finger lands. */
  .ripple{position:fixed; z-index:34; pointer-events:none; border-radius:50%; width:18px; height:18px;
    margin:-9px 0 0 -9px; background:radial-gradient(circle, rgba(255,255,255,.55), rgba(255,255,255,0) 70%);
    animation:rippleout .5s ease-out forwards}
  @keyframes rippleout{from{transform:scale(.3); opacity:.9} to{transform:scale(7); opacity:0}}
  .streakpill{display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:999px;
    font-weight:800; font-size:14px; background:linear-gradient(120deg,#FF8A5B,#FF5D8F); color:#fff;
    animation:pop .45s var(--ease)}
  .sayrow{display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap}
  .saybtn{
    width:76px; height:76px; border-radius:50%; flex:none; font-size:32px;
    background:linear-gradient(150deg,#FFD66B,#F2A93B); color:#3B2A00;
    box-shadow:0 6px 0 rgba(0,0,0,.24); transition:transform .14s var(--ease), box-shadow .14s ease;
  }
  .saybtn:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.24)}
  .sayhint{font-size:13.5px; font-weight:800; color:var(--ink-soft); letter-spacing:.03em}
  .choice.emo{font-size:clamp(44px,11vw,64px)}
  /* A character at 20px teaches nothing — Chinese is always shown big. */
  /* The card you just played, so your eye lands on it when you come back. */
  .world.justplayed{outline:5px solid var(--sun); outline-offset:3px}
  .choice.zh{font-family:"PingFang SC","Hiragino Sans GB","Heiti SC","Microsoft YaHei",sans-serif;
    font-size:clamp(40px,10vw,58px); font-weight:700}
  .zh-char{font-family:"PingFang SC","Hiragino Sans GB","Heiti SC","Microsoft YaHei",sans-serif;
    font-size:clamp(88px,24vw,150px); font-weight:700; line-height:1.05;
    text-shadow:0 6px 22px rgba(0,0,0,.35)}
  .zh-pinyin{font-weight:800; font-size:19px; color:#FFD98A; letter-spacing:.5px}
  .zh-tell{font-weight:800; font-size:17px; color:#8FE3C4}
  .zh-build{display:flex; gap:12px; align-items:center; justify-content:center}
  .zh-slot{font-family:"PingFang SC","Hiragino Sans GB","Heiti SC","Microsoft YaHei",sans-serif;
    font-size:clamp(46px,12vw,72px); font-weight:700; min-width:1.4em; padding:6px 10px;
    border-radius:18px; background:rgba(255,255,255,.22)}
  .zh-slot.blank{background:rgba(255,255,255,.06); color:var(--ink-soft); border:3px dashed rgba(255,255,255,.22)}
  .choice:active{transform:scale(.95)}
  .choice.right{background:var(--good); color:#04382A; animation:pop .32s var(--ease)}
  .choice.wrong{background:var(--bad); color:#fff; animation:shake .34s ease}
  .choice.dim{opacity:.35}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

  .flash{position:fixed; inset:0; z-index:30; display:grid; place-items:center; pointer-events:none; font-size:clamp(80px,24vw,170px); opacity:0}
  .flash.show{animation:flash .72s ease}
  @keyframes flash{0%{opacity:0; transform:scale(.5)}30%{opacity:1; transform:scale(1.08)}70%{opacity:1}100%{opacity:0; transform:scale(1)}}

  /* ---------- spelling ---------- */
  .slots{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  .slot{
    width:60px; height:72px; border-radius:16px; background:rgba(255,255,255,.10); border:3px dashed rgba(255,255,255,.28);
    display:grid; place-items:center; font-family:"Baloo 2",sans-serif; font-weight:800; font-size:34px; text-transform:uppercase;
  }
  .slot.filled{background:var(--grape); border-style:solid; border-color:transparent}
  .tiles{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:600px}
  .tile{
    width:62px; height:66px; border-radius:16px; background:rgba(255,255,255,.16); color:#fff;
    font-family:"Baloo 2",sans-serif; font-weight:800; font-size:30px; text-transform:uppercase;
    display:grid; place-items:center; transition:transform .14s var(--ease), opacity .14s ease;
  }
  .tile:active{transform:scale(.9)}
  .tile.used{opacity:.22}
  .tile.nope{animation:shake .34s ease}

  /* ---------- memory ---------- */
  .memgrid{display:grid; gap:11px; width:100%; max-width:520px}
  .card{
    aspect-ratio:1; border-radius:20px; background:linear-gradient(145deg,var(--grape),#B9A2FF); color:#fff;
    font-size:clamp(30px,8vw,46px); display:grid; place-items:center; transition:transform .2s var(--ease), background .2s ease;
  }
  .card:active{transform:scale(.94)}
  .card.up{background:rgba(255,255,255,.18)}
  .card.done{background:var(--good); opacity:.5}

  /* ---------- code path ---------- */
  .maze{display:grid; gap:5px; background:rgba(255,255,255,.08); padding:9px; border-radius:20px}
  .mz{aspect-ratio:1; border-radius:11px; background:rgba(255,255,255,.10); display:grid; place-items:center; font-size:clamp(18px,5vw,30px)}
  .mz.wall{background:rgba(0,0,0,.42)}
  .mz.goal{background:rgba(255,196,61,.30)}
  .queue{display:flex; gap:7px; flex-wrap:wrap; justify-content:center; min-height:52px; align-items:center;
    background:rgba(255,255,255,.08); border-radius:16px; padding:9px 12px; width:100%; max-width:520px}
  .queue .q{width:38px; height:38px; border-radius:11px; background:var(--sky); display:grid; place-items:center; font-size:20px; color:#04293A; font-weight:800}
  .queue .empty{font-size:14px; font-weight:800; color:var(--ink-soft)}
  .pad-keys{display:grid; grid-template-columns:repeat(3,64px); gap:9px; justify-content:center}
  .pad-keys button{height:64px; border-radius:18px; background:rgba(255,255,255,.16); font-size:26px}

  /* ---------- bubble pop ---------- */
  .timerpill{display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.12); border-radius:999px; padding:8px 18px; font-weight:800; font-size:17px}
  .timerpill b{font-family:"Baloo 2",sans-serif; font-size:21px; min-width:28px; display:inline-block}
  .arena{
    position:relative; width:100%; max-width:640px; flex:none;
    height:clamp(260px, 54vh, 540px);
    border-radius:var(--r-xl); background:rgba(255,255,255,.06); overflow:hidden;
  }
  .bubble{
    position:absolute; width:var(--bub,76px); height:var(--bub,76px); border-radius:50%;
    background:radial-gradient(circle at 34% 28%, rgba(255,255,255,.95), rgba(127,227,255,.75) 46%, rgba(47,182,230,.85));
    color:#08324A; font-family:"Baloo 2",sans-serif; font-weight:800; font-size:26px;
    display:grid; place-items:center; box-shadow:0 4px 0 rgba(0,0,0,.20); will-change:transform;
  }
  .bubble.emo{font-size:36px; background:radial-gradient(circle at 34% 28%, rgba(255,255,255,.95), rgba(255,220,150,.8) 46%, rgba(255,196,61,.85))}
  .bubble.pop-ok{animation:popout .26s ease forwards}
  .bubble.pop-no{animation:popbad .26s ease forwards}
  @keyframes popout{to{transform:scale(1.7); opacity:0}}
  @keyframes popbad{to{transform:scale(.4); opacity:0; filter:saturate(0)}}

  /* ---------- copy the lights ---------- */
  .pads{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; width:min(88vw,380px)}
  /* Named apart from the page wrapper .pad — sharing the name dimmed every
     screen in the app to 55% and gave it a square aspect ratio. */
  .litpad{aspect-ratio:1; border-radius:26px; opacity:.55; box-shadow:0 6px 0 rgba(0,0,0,.28); transition:opacity .12s ease, transform .12s ease}
  .litpad.lit{opacity:1; transform:scale(1.05)}
  .litpad:active{transform:scale(.96)}

  /* ---------- sorting boxes ---------- */
  .bins{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; width:100%; max-width:600px}
  .bin{
    min-height:120px; border-radius:var(--r-lg); background:rgba(255,255,255,.12);
    border:4px dashed rgba(255,255,255,.28); display:grid; place-items:center; padding:14px;
    transition:background .16s ease, transform .14s var(--ease);
  }
  .bin .bl{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:clamp(17px,4.4vw,23px); line-height:1.2}
  .bin:active{transform:scale(.96)}
  .bin.bin-ok{background:var(--good); border-color:transparent; color:#04382A}
  .bin.bin-no{background:var(--bad); border-color:transparent}

  /* ---------- balance scale ---------- */
  .scale{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; max-width:560px}
  .scale .pan{
    flex:1; min-height:104px; border-radius:var(--r-lg); background:rgba(255,255,255,.12);
    display:grid; place-items:center; padding:14px; border:3px solid rgba(255,255,255,.18);
  }
  .scale .pv{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:clamp(26px,6.5vw,40px)}
  .scale .fulcrum{font-size:clamp(30px,8vw,44px); flex:none}

  /* ---------- fractions ---------- */
  .fracbar{display:flex; width:100%; max-width:560px; border-radius:18px; overflow:hidden; border:4px solid #fff}
  .fracseg{flex:1; aspect-ratio:1.9; background:rgba(255,255,255,.10); border-right:3px solid #fff}
  .fracseg:last-child{border-right:none}
  .fracseg.on{background:var(--sun)}

  /* ---------- ordering games (life cycles, food chains) ---------- */
  .cycleslots{display:flex; align-items:center; gap:7px; flex-wrap:wrap; justify-content:center; max-width:620px}
  .cycleslots .arrow{font-size:22px; color:var(--ink-soft); font-weight:800}
  .cslot{
    width:84px; min-height:92px; border-radius:18px; background:rgba(255,255,255,.08);
    border:3px dashed rgba(255,255,255,.26); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:3px; padding:6px;
  }
  .cslot.filled{background:var(--mint); border-style:solid; border-color:transparent; color:#04382A}
  .cslot .cn{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:20px; color:var(--ink-soft)}
  .cslot .se{font-size:30px; line-height:1}
  .cslot .sl{font-size:11px; font-weight:800; text-align:center; line-height:1.15}
  .tray{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:620px}
  .stagecard{
    width:96px; min-height:98px; border-radius:18px; background:rgba(255,255,255,.14); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:8px;
    transition:transform .14s var(--ease), opacity .16s ease;
  }
  .stagecard .se{font-size:32px; line-height:1}
  .stagecard .sl{font-size:11.5px; font-weight:800; text-align:center; line-height:1.15}
  .stagecard:active{transform:scale(.94)}
  .stagecard.used{opacity:.2}
  .stagecard.nope{animation:shake .34s ease}

  /* ---------- inspector ---------- */
  .spotpair{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; width:100%; max-width:620px}
  .spotgrid{display:grid; gap:5px; flex:1 1 44%; min-width:150px; background:rgba(255,255,255,.08); padding:8px; border-radius:18px}
  .spotcell{
    aspect-ratio:1; border-radius:11px; background:rgba(255,255,255,.10);
    font-size:clamp(20px,5vw,30px); display:grid; place-items:center;
    transition:transform .13s var(--ease), background .16s ease;
  }
  .spotcell:not(:disabled):active{transform:scale(.92)}
  .spotcell.right{background:var(--good)} .spotcell.wrong{background:var(--bad)}
  .spotvs{font-weight:800; color:var(--ink-soft); font-size:14px; flex:none}
  .scangrid{display:grid; gap:4px; width:100%; max-width:520px; background:rgba(255,255,255,.06); padding:8px; border-radius:18px}
  .scancell{
    aspect-ratio:1; border-radius:9px; background:transparent;
    font-size:clamp(15px,4vw,26px); display:grid; place-items:center;
    transition:transform .12s var(--ease), background .16s ease;
  }
  .scancell:active{transform:scale(.88)}
  .scancell.right{background:var(--good)} .scancell.wrong{background:var(--bad)}
  .shadow{
    font-size:clamp(78px,20vw,140px); line-height:1;
    filter:brightness(0) drop-shadow(0 0 12px rgba(255,255,255,.22));
  }
  .lineup{display:flex; gap:11px; flex-wrap:wrap; justify-content:center; width:100%; max-width:600px}
  .suspect{
    flex:1 1 118px; min-width:104px; border-radius:22px; padding:13px 9px; color:#14113A;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    box-shadow:0 6px 0 rgba(0,0,0,.24); transition:transform .14s var(--ease);
  }
  .suspect:active{transform:scale(.95)}
  .suspect .sf{font-size:clamp(32px,8vw,44px); line-height:1}
  .suspect .sa{font-size:22px; line-height:1}
  .suspect .sc{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; opacity:.75}
  .suspect.right{outline:5px solid var(--good); outline-offset:3px}
  .suspect.wrong{outline:5px solid var(--bad); outline-offset:3px; opacity:.6}

  /* ---------- sound & music ---------- */
  .tunepads{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; width:100%; max-width:560px}
  .tunepad{
    flex:1 1 84px; min-width:76px; height:104px; border-radius:22px; opacity:.6;
    box-shadow:0 6px 0 rgba(0,0,0,.28); color:#14113A;
    font-family:"Baloo 2",sans-serif; font-weight:800; font-size:19px;
    display:grid; place-items:center; transition:opacity .12s ease, transform .12s ease;
  }
  .tunepad.lit{opacity:1; transform:translateY(-5px) scale(1.04)}
  .tunepad:active{transform:scale(.95)}

  /* ---------- guessing ---------- */
  .numpad{display:grid; grid-template-columns:repeat(5,1fr); gap:9px; width:100%; max-width:440px; margin:0 auto}
  .numkey{
    aspect-ratio:1; border-radius:16px; background:rgba(255,255,255,.16); color:#fff;
    font-family:"Baloo 2",sans-serif; font-weight:800; font-size:clamp(20px,5vw,26px);
    display:grid; place-items:center; transition:transform .13s var(--ease), opacity .16s ease;
  }
  .numkey:active{transform:scale(.92)}
  .numkey.out{opacity:.18}
  .slider{width:100%; height:44px; accent-color:var(--sun); background:transparent}
  .clues{display:flex; flex-direction:column; gap:9px; width:100%; max-width:520px}
  .clue{
    display:flex; align-items:flex-start; gap:11px; background:rgba(255,255,255,.10);
    border-radius:16px; padding:12px 14px; font-weight:700; font-size:clamp(15px,3.9vw,18px); line-height:1.4;
  }
  .clue .cnum{
    width:24px; height:24px; border-radius:8px; flex:none; display:grid; place-items:center;
    background:var(--grape); color:#fff; font-weight:800; font-size:13px;
  }
  .mystery{position:relative; width:min(72vw,270px); aspect-ratio:1}
  .mystery .myemo{position:absolute; inset:0; display:grid; place-items:center; font-size:clamp(70px,18vw,130px)}
  .mystery .cover{position:absolute; inset:0; display:grid; grid-template-columns:repeat(3,1fr); gap:4px}
  .mtile{border-radius:12px; background:var(--grape); transition:opacity .25s ease, transform .25s ease}
  .mtile.open{opacity:0; transform:scale(.6); pointer-events:none}

  .countrow{font-size:clamp(34px,8vw,54px); line-height:1.5; max-width:620px; word-spacing:6px}
  .coinrow{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:560px}
  .coin{
    min-width:66px; height:66px; border-radius:50%; padding:0 10px;
    background:radial-gradient(circle at 34% 30%, #FFE9A8, #E8B33D);
    color:#4A3400; font-family:"Baloo 2",sans-serif; font-weight:800; font-size:18px;
    display:grid; place-items:center; box-shadow:0 4px 0 rgba(0,0,0,.28);
  }

  /* ---------- result ---------- */
  .result{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; flex:1; padding:24px}
  .stars-big{font-size:clamp(50px,14vw,86px); letter-spacing:6px}
  .score{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:clamp(34px,9vw,54px)}
  .fact{background:rgba(255,255,255,.10); border-radius:var(--r-lg); padding:16px 18px; max-width:560px; font-weight:700; line-height:1.5; font-size:15.5px}

  /* ---------- modals ---------- */
  .scrim{position:fixed; inset:0; z-index:40; background:rgba(28,22,86,.58); display:grid; place-items:center; padding:20px; overflow-y:auto}
  .sheet{background:#3A3286; border-radius:var(--r-xl); padding:26px; width:min(460px,100%); box-shadow:0 24px 60px rgba(0,0,0,.5); animation:rise .3s var(--ease)}
  @keyframes rise{from{transform:translateY(18px) scale(.96); opacity:0} to{transform:none; opacity:1}}
  .gsi-wrap{margin:0 0 4px; display:flex; justify-content:center; min-height:44px}
  .or-line{display:flex; align-items:center; gap:12px; margin:16px 0 14px; color:var(--ink-soft);
    font-weight:800; font-size:12.5px; letter-spacing:.09em; text-transform:uppercase}
  .or-line:before, .or-line:after{content:""; flex:1; height:2px; background:rgba(255,255,255,.12)}
  .sheet h2{margin:0 0 8px; font-size:26px}
  .sheet p{margin:0 0 18px; color:#C9C4EE; font-weight:700; line-height:1.55; font-size:15px}
  .field{margin-bottom:13px}
  .savednote{font-size:13px; font-weight:800; color:#8FE3C4; line-height:1.5;
    background:rgba(53,196,143,.14); border-radius:14px; padding:10px 13px; margin:-6px 0 14px}
  /* ---- sign in / account ---- */
  .seg2{display:flex; gap:8px; margin-bottom:16px; background:rgba(0,0,0,.22); padding:5px; border-radius:16px}
  .seg2b{flex:1; min-height:48px; border-radius:12px; font-family:inherit; font-size:14.5px; font-weight:800;
    background:transparent; color:var(--ink-soft); transition:background .16s ease, color .16s ease}
  .seg2b.on{background:linear-gradient(140deg,var(--grape),#7B5BE0); color:#fff}
  .checkrow{display:flex; align-items:center; gap:11px; width:100%; text-align:left; min-height:52px;
    padding:8px 4px; background:none; font-family:inherit}
  .ckbox{width:26px; height:26px; flex:none; border-radius:9px; display:grid; place-items:center;
    border:3px solid rgba(255,255,255,.3); font-size:15px; font-weight:800; color:#04382A;
    background:transparent; transition:background .16s ease, border-color .16s ease}
  .checkrow.on .ckbox{background:var(--mint); border-color:var(--mint)}
  .cklabel{font-size:14px; font-weight:700; color:#C9C4EE; line-height:1.35}
  .miniacc{display:flex; align-items:center; gap:10px; padding:11px 13px; border-radius:14px;
    background:rgba(255,255,255,.12)}
  .ma-e{font-size:21px; line-height:1; flex:none}
  .ma-n{font-size:14px; font-weight:800; word-break:break-all; min-width:0}
  .account{border-radius:20px; padding:15px 16px; margin:-6px 0 16px;
    background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.14)}
  .acc-top{display:flex; gap:13px; align-items:flex-start}
  .acc-e{font-size:28px; line-height:1; flex:none}
  .acc-mid{min-width:0; flex:1}
  .acc-l{font-size:11.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft)}
  .acc-n{font-weight:800; font-size:15.5px; margin:2px 0 4px; word-break:break-all}
  .acc-s{font-size:12.5px; font-weight:700; color:#C9C4EE; line-height:1.45}
  .acc-out{width:100%; margin-top:13px; min-height:50px; font-size:15px}
  .fieldnote{font-size:12.5px; font-weight:700; color:#8FE3C4; margin:-3px 0 7px}
  .field label{display:block; font-size:12px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:7px}
  .field input{
    width:100%; border:3px solid rgba(255,255,255,.16); border-radius:var(--r-md); padding:14px 16px;
    font-family:"Baloo 2",sans-serif; font-size:18px; font-weight:700; color:#fff; background:rgba(0,0,0,.24);
  }
  .field input:focus{outline:none; border-color:var(--grape)}
  .ages{display:flex; gap:8px; flex-wrap:wrap}
  .agebtn{
    width:52px; height:52px; border-radius:16px; background:rgba(255,255,255,.12);
    font-family:"Baloo 2",sans-serif; font-weight:800; font-size:20px; color:#fff;
    display:grid; place-items:center; transition:transform .14s var(--ease), background .14s ease;
  }
  .agebtn[aria-pressed="true"]{background:var(--sun); color:#3A2A00; transform:scale(1.06)}
  .avatars{display:flex; gap:9px; flex-wrap:wrap}
  .av{width:58px; height:58px; border-radius:18px; background:rgba(255,255,255,.12); font-size:30px; display:grid; place-items:center; transition:transform .14s var(--ease)}
  .av[aria-pressed="true"]{background:var(--sun); transform:scale(1.06)}
  .err{color:#FF9DBB; font-weight:800; font-size:14px; min-height:20px; margin-top:6px}

  /* ---- write or draw ---- */
  .writebox textarea{
    width:100%; border:3px solid var(--line, rgba(255,255,255,.18)); border-radius:var(--r-md);
    padding:12px 14px; font-family:"Baloo 2",sans-serif; font-size:17px; font-weight:700;
    color:#fff; background:rgba(0,0,0,.22); resize:vertical; min-height:84px;
  }
  .writebox textarea:focus{outline:none; border-color:#9B7BFF}
  .seg{display:flex; gap:8px; background:rgba(0,0,0,.2); border-radius:14px; padding:5px}
  .seg button{flex:1; border:0; background:none; padding:10px 8px; border-radius:10px;
    font-family:"Baloo 2",sans-serif; font-weight:800; font-size:14.5px; color:#C9C4EE; cursor:pointer}
  .seg button.active{background:#fff; color:#3A3286}
  .drawwrap{width:100%; border-radius:16px; overflow:hidden; border:3px solid rgba(255,255,255,.18);
    background:#fff; touch-action:none; line-height:0}
  .drawwrap canvas{width:100%; height:auto; display:block; touch-action:none; cursor:crosshair}
  .palette{display:flex; align-items:center; gap:9px; margin-top:12px; flex-wrap:wrap}
  .swatch{width:30px; height:30px; border-radius:50%; border:3px solid transparent; padding:0; cursor:pointer;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .swatch.on{border-color:#FFD98A; transform:scale(1.12)}
  .btn-sm{padding:9px 16px; font-size:14px; min-width:0; margin-left:auto}
  .linkbtn{background:none; padding:0; min-height:0; color:#C4B3FF; font-weight:800; text-decoration:underline; text-underline-offset:3px; font-size:14.5px}
  .perks{list-style:none; padding:0; margin:0 0 18px; display:flex; flex-direction:column; gap:8px}
  .perks li{display:flex; gap:10px; align-items:center; font-weight:700; font-size:14.5px; color:#C9C4EE}
  .perks .tk{width:22px; height:22px; border-radius:8px; background:var(--mint); color:#04382A; display:grid; place-items:center; font-size:13px; font-weight:800; flex:none}

  .pill{display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:999px; font-weight:800; font-size:13px; background:rgba(255,255,255,.12)}
  .pill.trial{background:rgba(255,196,61,.22); color:#FFD98A}
  .pill.full{background:rgba(53,196,143,.22); color:#8FE3C4}

  .printcard{
    display:flex; align-items:center; gap:16px; width:100%; text-align:left; margin-top:20px;
    border-radius:var(--r-xl); padding:20px; color:#14113A;
    background:linear-gradient(140deg,#FFE3A8,#FFC43D); box-shadow:0 8px 0 rgba(0,0,0,.22);
    transition:transform .18s var(--ease), box-shadow .18s ease;
  }
  .printcard:active{transform:translateY(4px); box-shadow:0 3px 0 rgba(0,0,0,.22)}
  .printcard .pe{font-size:42px; flex:none}
  .printcard .pn{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:20px; line-height:1.15}
  .printcard .ps{font-size:13.5px; font-weight:700; opacity:.74; line-height:1.35; margin-top:3px}
  .printcard .go{margin-left:auto; font-size:26px; flex:none}

  .subject{
    font-family:"Baloo 2",sans-serif; font-weight:800; font-size:19px; margin:26px 0 13px;
    display:flex; align-items:center; gap:10px;
  }
  .topic{
    font-family:"Nunito",sans-serif; font-weight:800; font-size:12.5px; letter-spacing:1.1px;
    text-transform:uppercase; color:var(--ink-soft); margin:16px 0 10px;
  }
  .subject::after{content:""; flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.12)}
  .sgtag{
    position:absolute; top:14px; right:14px; background:rgba(0,0,0,.24); color:#fff;
    border-radius:999px; padding:5px 11px; font-size:11px; font-weight:800; letter-spacing:.5px;
  }
  .story{
    background:rgba(255,255,255,.10); border-radius:var(--r-lg); padding:15px 17px; max-width:520px;
    font-weight:700; font-size:clamp(15px,3.8vw,18px); line-height:1.5;
  }

  .footrow{display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-top:22px}
  @media (max-width:420px){ .footrow{grid-template-columns:1fr} }
  .aboutmark{
    width:62px; height:62px; border-radius:20px; display:grid; place-items:center; font-size:32px;
    background:linear-gradient(145deg,var(--sun),var(--coral)); box-shadow:0 4px 0 rgba(0,0,0,.25); margin-bottom:14px;
  }
  .kids{display:grid; gap:10px; margin:0 0 18px}
  .kid{display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.08); border-radius:var(--r-md); padding:12px 14px}
  .kid .ke{font-size:24px; flex:none}
  .kid .kn{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:17px; line-height:1.1}
  .kid .kd{font-size:13px; font-weight:700; color:var(--ink-soft); margin-top:2px}
